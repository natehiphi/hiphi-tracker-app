<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light"><meta name="robots" content="noindex">
<title>Unsubscribe · HIPHI Bill Tracker</title>
<link rel="icon" href="pub/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<!-- The page every email's "Unsubscribe" link opens (R-180, X1-7). Opening it changes nothing: only the button below sends the
     unsubscribe (or the mail app's own one-click button, which posts to the same function). A mail scanner that follows every
     link in a message therefore cannot unsubscribe anyone, and the page shows properly (Supabase serves a function's HTML as
     plain text, so the page lives here). The link is ?u=<token>&what=hearing|action|all, from the email. The function is
     backend supabase/functions/unsubscribe. In the tracker's own colours and type, like text-terms.html.
     A partner ask's "Stop asks from this partner" link (R-328 batch G, backend migration 185 partner_stop_url) is
     ?partner=<slug>&pt=<token>: its own question and one button, which calls partner_asks_stop with the public key, then Undo
     (B-5). It never offers "Stop all email": HIPHI's own emails are not what the person asked to stop. Opening it changes
     nothing either (it only reads the partner's public name). &demo=1 is the practice copy's: it answers here, sends nothing. -->
<style>
  :root { --p700: #00698E; --p800: #024F69; --n0: #FFFFFF; --n50: #F4F7F9; --n200: #DBE3E7; --n500: #5F6F76; --n900: #142B35; --ok: #1B6B3A;
          --font-h: 'Poppins', 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif; --font: 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--n50); color: var(--n900); font: 400 1rem/1.6 var(--font); }
  header { background: var(--n0); border-bottom: 1px solid var(--n200); }
  header a { display: inline-flex; align-items: center; gap: 8px; padding: 14px 16px; color: var(--n900); text-decoration: none; font: 700 1rem var(--font-h); }
  header img { width: 28px; height: 28px; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font: 700 1.75rem/1.2 var(--font-h); margin: 8px 0 16px; }
  p { margin: 0 0 12px; }
  a { color: var(--p700); }
  .card { background: var(--n0); border: 1px solid var(--n200); border-radius: 16px; padding: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--p700); color: #fff; font: 700 1rem var(--font); cursor: pointer; }
  button:hover { background: var(--p800); }
  button[aria-busy="true"] { opacity: .7; cursor: progress; }
  .keep { display: inline-flex; align-items: center; min-height: 48px; padding: 0 8px; }
  .small { color: var(--n500); font-size: .875rem; margin-top: 16px; }
  .ok { color: var(--ok); font-weight: 700; }
  button.quiet { background: var(--n0); color: var(--p700); box-shadow: inset 0 0 0 2px var(--p700); }
  button.quiet:hover { background: var(--n50); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--p700); outline-offset: 2px; }
</style>
</head><body>
<header><a href="track.html"><img src="pub/icon.svg" alt="">HIPHI Bill Tracker</a></header>
<main>
  <div class="card" id="u-card" aria-live="polite">
    <h1 id="u-h">Stop these emails?</h1>
    <p id="u-p">Press the button to stop them.</p>
    <div class="row" id="u-row"><button type="button" id="u-go">Yes, unsubscribe</button><a class="keep" id="u-keep" href="track.html">No, keep them</a></div>
    <p class="small" id="u-note"></p>
  </div>
  <noscript><p class="small">This page needs JavaScript to unsubscribe. You can also email <a href="mailto:contact@hiphi.org">contact@hiphi.org</a> and we will do it for you.</p></noscript>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), token = q.get('u') || '', what = ['hearing', 'action', 'all'].indexOf(q.get('what')) >= 0 ? q.get('what') : 'all';
  var URL_ = 'https://eivzjbnygscguqqiiuvh.supabase.co/functions/v1/unsubscribe';
  var $ = function (id) { return document.getElementById(id); };
  var WHAT = { hearing: ['Stop hearing alerts?', 'You will no longer get an email when a bill on your issues gets a hearing.'],
               action: ['Stop action alerts?', 'You will no longer get emails from HIPHI that ask you to speak up.'],
               all: ['Stop all email from the tracker?', 'You will no longer get any email from the HIPHI Bill Tracker.'] };
  var CONTACT = 'You can also email <a href="mailto:contact@hiphi.org">contact@hiphi.org</a> and we will do it for you.';
  function show(h, p, note, hideRow) { $('u-h').textContent = h; $('u-p').innerHTML = p; $('u-note').innerHTML = note || ''; if (hideRow) $('u-row').hidden = true; }
  if (q.has('partner')) { partnerStop(); return; }
  if (!/^[0-9a-f-]{36}$/i.test(token)) { show('That link looks incomplete', 'Open the email again and press the link once more. ' + CONTACT, '', true); document.title = 'Unsubscribe · HIPHI Bill Tracker'; return; }
  show(WHAT[what][0], WHAT[what][1] + ' Nothing changes until you press the button.', 'Changed your mind? Not pressing it keeps everything as it is.');
  $('u-go').addEventListener('click', function () {
    var b = $('u-go'); if (b.getAttribute('aria-busy')) return; b.setAttribute('aria-busy', 'true'); b.textContent = 'Unsubscribing…';
    fetch(URL_ + '?u=' + encodeURIComponent(token) + '&what=' + encodeURIComponent(what), { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body: 'List-Unsubscribe=One-Click' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        if (x.r.ok && x.j.ok) { show('Done', '<span class="ok">' + (x.j.said || 'You are unsubscribed.') + '</span>', (x.j.account ? 'Account: ' + x.j.account.replace(/[<>&]/g, '') + '. ' : '') + 'You can change your mind any time in <a href="track.html#/profile">your profile</a>, under More.', true); document.title = 'Unsubscribed · HIPHI Bill Tracker'; $('u-h').setAttribute('tabindex', '-1'); $('u-h').focus(); }
        else if (x.j.why === 'unknown') { show('We could not find that account', 'It may have been deleted already. ' + CONTACT, '', true); }
        else { throw new Error('failed'); }
      })
      .catch(function () { b.removeAttribute('aria-busy'); b.textContent = 'Try again'; $('u-note').innerHTML = 'That did not go through. Check your connection and press the button again. ' + CONTACT; });
  });

  // Stop asks from one HIPHI partner (R-328 batch G). The token is the person's email token (u= in HIPHI's own links), here
  // under pt= so the page above never reads this link as one for all email.
  function partnerStop() {
    var slug = (q.get('partner') || '').toLowerCase(), pt = q.get('pt') || '', demo = q.get('demo') === '1', name = '';
    var REST = 'https://eivzjbnygscguqqiiuvh.supabase.co/rest/v1/', KEY = 'sb_publishable_uvEtw8ru3zB9lDOxAjzrUA_JEFvKyul';
    var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var who = function () { return name || 'this HIPHI partner'; };
    var DEMO_NOTE = demo ? ' This is the practice copy, so nothing changed.' : '';
    if (!/^[a-z0-9-]{2,60}$/.test(slug) || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(pt)) {
      show('That link looks incomplete', 'Open the email again and press the link once more. ' + CONTACT, '', true); return;
    }
    var go = $('u-go'), undoRow = null;
    function ask(note) {
      show('Stop asks from ' + who() + '?', 'You will no longer get its asks by email or text. HIPHI’s own emails still come. Nothing changes until you press the button.',
        note || 'Changed your mind? Not pressing it keeps everything as it is.');
      go.textContent = 'Stop asks from this partner'; go.removeAttribute('aria-busy'); $('u-row').hidden = false;
      if (undoRow) undoRow.hidden = true;
    }
    function call(stop) {
      if (demo) return new Promise(function (ok) { setTimeout(function () { ok(slug === 'keiki-smiles' ? { ok: true, partner: slug, partner_name: 'Keiki Smiles Alliance', stopped: stop } : { ok: false, why: 'partner' }); }, 300); });
      return fetch(REST + 'rpc/partner_asks_stop', { method: 'POST', headers: { 'content-type': 'application/json', apikey: KEY, authorization: 'Bearer ' + KEY },
        body: JSON.stringify({ p_partner: slug, p_stop: stop, p_token: pt }) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error('failed'); return j || {}; }); });
    }
    function refused(j) {
      if (j.why === 'unknown') show('We could not find that account', 'It may have been deleted already. ' + CONTACT, '', true);
      else show('That partner isn’t on the tracker now', 'So its asks can’t reach you. Your other emails are as they were. ' + CONTACT, '', true);
      if (undoRow) undoRow.hidden = true;
    }
    function failed(b) { b.removeAttribute('aria-busy'); b.textContent = 'Try again'; $('u-note').innerHTML = 'That did not go through. Check your connection and press the button again. ' + CONTACT; }
    function done() {
      show('Done', '<span class="ok">You won’t get asks from ' + esc(who()) + '.</span> HIPHI’s own emails still come.',
        'Choose how many partner asks you get in <a href="track.html#/alerts">Your alerts</a>.' + DEMO_NOTE, true);
      if (!undoRow) {
        undoRow = document.createElement('div'); undoRow.className = 'row'; undoRow.id = 'u-undorow';
        undoRow.innerHTML = '<button type="button" class="quiet" id="u-undo">Undo</button>';
        $('u-p').parentNode.insertBefore(undoRow, $('u-note'));
        $('u-undo').addEventListener('click', function () {
          var b = $('u-undo'); if (b.getAttribute('aria-busy')) return; b.setAttribute('aria-busy', 'true'); b.textContent = 'Undoing…';
          call(false).then(function (j) {
            if (!j.ok) { refused(j); return; }
            b.removeAttribute('aria-busy'); b.textContent = 'Undo';
            ask('Undone. Asks from ' + esc(who()) + ' can come again.' + DEMO_NOTE); document.title = 'Unsubscribe · HIPHI Bill Tracker'; go.focus();
          }).catch(function () { failed(b); });
        });
      }
      undoRow.hidden = false; $('u-undo').textContent = 'Undo';
      document.title = 'Stopped · HIPHI Bill Tracker'; $('u-h').setAttribute('tabindex', '-1'); $('u-h').focus();
    }
    ask();
    // The partner's public name, so the question can name it (a read only; until it answers, or if it cannot, "this HIPHI partner").
    if (demo) { if (slug === 'keiki-smiles') { name = 'Keiki Smiles Alliance'; ask(); } }
    else fetch(REST + 'public_partners?select=name&slug=eq.' + encodeURIComponent(slug) + '&apikey=' + KEY)
      .then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) { if (!name && rows && rows[0] && rows[0].name && !go.getAttribute('aria-busy') && !$('u-row').hidden) { name = rows[0].name; $('u-h').textContent = 'Stop asks from ' + name + '?'; } })
      .catch(function () { /* the question says "this HIPHI partner" */ });
    go.addEventListener('click', function () {
      if (go.getAttribute('aria-busy')) return; go.setAttribute('aria-busy', 'true'); go.textContent = 'Stopping…';
      call(true).then(function (j) { if (j.ok) { if (j.partner_name) name = j.partner_name; done(); } else refused(j); })
        .catch(function () { failed(go); });
    });
  }
})();
</script>
</body></html>
