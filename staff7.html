<!-- Staff7 is practice-only for now: with no ?demo in the address (the data layer's own test) it sends itself to ?demo=1 BEFORE any module loads; app.js
     then checks the same thing again before it imports anything, so a real sign-in or a real write can never happen from this page yet. Remove this one script when the live app is ready for it. -->
<script>if (!new URLSearchParams(location.search).has('demo')) { var q = new URLSearchParams(location.search); q.set('demo', '1'); location.replace(location.pathname + '?' + q.toString() + location.hash); }</script>
