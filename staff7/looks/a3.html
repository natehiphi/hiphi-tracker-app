<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff app, look A: Paper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --f14:14px;--f16:16px;--f18:18px;--f22:22px;--f28:28px;
  --bg:#F3EFE6;--ink:#1C1915;--muted:#5C554B;--rule:#E3DED3;--edge:#8A8277;
  --act:#00698E;--act-p:#005674;--on-act:#FFFFFF;--surface:#FFFFFF;--tint:#EAE5D8;--ring:#00698E;
  --late:#B3261E;--back:#8A3B12;--done:#2E7650;--plum:#2E1533;
  --head:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Lato',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sh1:0 1px 2px rgba(60,45,20,.06);
  --sheet:0 1px 2px rgba(60,45,20,.06),0 12px 32px rgba(60,45,20,.08);
  --ease:cubic-bezier(.2,.7,.2,1);
}
:root[data-mode="public"]{
  --bg:#2E1533;--ink:#FFF4E6;--muted:#E0CBDD;--rule:#5A3A61;--edge:#C79BB8;
  --act:#F6C9D4;--act-p:#EBB0BF;--on-act:#2E1533;--surface:#3C1F44;--tint:#3C1F44;--ring:#F6C9D4;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--f16)/1.55 var(--body);min-height:100vh}
h1,h2,h3{font-family:var(--head);font-weight:600;margin:0;color:var(--ink)}
h1{font-size:var(--f28);line-height:1.2;letter-spacing:-.02em}
h2{font-size:var(--f22);line-height:1.25;letter-spacing:-.02em}
h3{font-size:var(--f18);line-height:1.3}
h1:focus{outline:none}
p{margin:0}
ul,ol{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:var(--s4);top:-80px;background:var(--ink);color:var(--bg);padding:var(--s3) var(--s4);z-index:100;border-radius:8px}
.skip:focus{top:var(--s2)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.enter{animation:enter .2s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s5);border-radius:8px;border:1px solid transparent;font:600 var(--f16)/1 var(--head);cursor:pointer;text-decoration:none;text-align:center;background:none}
.btn.filled{background:var(--act);color:var(--on-act)}
.btn.filled:hover{background:var(--act-p)}
.btn.filled:active{background:var(--act-p)}
.btn.quiet{border-color:var(--edge);color:var(--ink);background:transparent}
.btn.quiet:hover{background:var(--tint)}
.btn.text{color:var(--act);padding:0 var(--s2);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;font-family:var(--body);font-weight:700}
:root[data-mode="public"] .btn.text{color:var(--act)}
.btn.text:hover{color:var(--act-p);text-decoration-thickness:2px}
:root[data-mode="public"] .btn.text:hover{color:#fff}
.btn.is-loading{pointer-events:none;background:var(--act-p);color:var(--on-act)}
.btn:disabled{background:var(--tint);color:var(--muted);cursor:not-allowed}

/* ---------- rail (phone: bottom bar) ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.bar ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
.bar .brand,.bar .who{display:none}
.bi{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);min-height:64px;padding:var(--s2);background:none;border:0;text-decoration:none;color:var(--muted);font:500 var(--f14)/1.2 var(--head);cursor:pointer;width:100%}
.bi[aria-current="page"],.bi.open{color:var(--ink);font-weight:700}
.rpill{display:flex;align-items:center;justify-content:center;width:48px;height:32px;border-radius:16px}
.bi[aria-current="page"] .rpill,.bi.open .rpill{background:#fff;box-shadow:var(--sh1)}
.bar.off{display:none}
.person{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh1);font:600 var(--f14)/1 var(--head);color:var(--ink);flex:none}
.person.sm{width:32px;height:32px;background:var(--tint);box-shadow:none}

/* ---------- phone page frame ---------- */
.page{max-width:680px;margin:0 auto;padding:var(--s5) var(--s4) calc(var(--s8) + var(--s7) + env(safe-area-inset-bottom))}
.page.bare{padding-bottom:var(--s8)}
.page.wide{max-width:960px}
.back{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;color:var(--act);text-decoration:none;font-weight:700;margin:0 0 var(--s2) calc(var(--s2) * -1);padding:0 var(--s2)}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.paper{background:#fff;border-radius:16px;box-shadow:var(--sheet);container-type:inline-size}
.pn{padding:var(--s5) var(--s4)}

/* ---------- list column ---------- */
.ghead{margin-bottom:var(--s2)}
.greet{font:600 var(--f22)/1.25 var(--head);letter-spacing:-.02em}
.gdate{font-size:var(--f14);color:var(--muted);margin-top:var(--s1)}
.lh{font:600 var(--f16)/1.3 var(--head);margin:var(--s5) 0 var(--s3);display:flex;align-items:center}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 var(--s2);border-radius:12px;background:var(--act);color:#fff;font:700 var(--f14)/1 var(--head);margin-left:var(--s2)}
.cnt.grey{background:none;color:var(--muted);font-weight:600;padding:0;min-width:0}
.scards,.irows{list-style:none;margin:0;padding:0}
.scards{display:grid;gap:var(--s2)}
.scard{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s3);align-items:center;min-height:64px;padding:var(--s3) var(--s4);background:#fff;border-radius:12px;box-shadow:var(--sh1);text-decoration:none;color:inherit}
.scard:hover{box-shadow:0 1px 2px rgba(60,45,20,.08),0 4px 12px rgba(60,45,20,.1)}
.scard.sel{box-shadow:0 0 0 2px var(--act)}
.tile{width:40px;height:40px;border-radius:50%;background:#E3F0F5;color:var(--act);display:flex;align-items:center;justify-content:center}
.tile.back{background:#F8E7DC;color:var(--back)}
.scard .rt{display:block;font:600 var(--f16)/1.3 var(--head)}
.scard .l2{display:block;font-size:var(--f14);color:var(--muted);margin-top:var(--s1);line-height:1.4}
.scard .l2 b{color:var(--ink);font-weight:400}
.scard .l2 .no2{white-space:nowrap}
.sbk{color:var(--back);font-weight:700;display:inline-flex;gap:var(--s1);align-items:center;margin-left:var(--s2);white-space:nowrap}
.sbk svg{width:14px;height:14px}
.tp{display:inline-flex;align-items:center;gap:var(--s1);padding:var(--s1) var(--s2);border-radius:999px;background:#EFEAE0;color:var(--ink);font:600 var(--f14)/1.3 var(--head);white-space:nowrap}
.tp.soon{background:#FBEFD9;color:#7A4A00}
.tp svg{width:14px;height:14px}
.calmcard{display:flex;align-items:center;gap:var(--s4);background:#fff;border-radius:12px;padding:var(--s4);box-shadow:var(--sh1);font:600 var(--f16)/1.3 var(--head)}
.calmcard svg{width:56px;height:28px;color:var(--muted);flex:none}
.dline{display:flex;align-items:flex-start;gap:var(--s3);margin:var(--s5) calc(var(--s2) * -1) 0;padding:var(--s3) var(--s2);border-radius:12px;color:var(--muted);font-size:var(--f14);line-height:1.5;text-decoration:none;min-height:44px}
.dline svg{width:20px;height:20px;margin-top:0}
.dline:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.dline.sel{background:#fff;box-shadow:var(--sh1);color:var(--ink)}
.dline b{color:var(--ink);font-weight:700}
.irows{display:grid;gap:var(--s1)}
.irow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:var(--s3);align-items:center;min-height:48px;padding:var(--s2);margin:0 calc(var(--s2) * -1);border-radius:12px;text-decoration:none;color:inherit}
.irow:hover{background:rgba(255,255,255,.55)}
.irow.sel{background:#fff;box-shadow:var(--sh1)}
.imark{width:28px;height:28px;border-radius:8px;background:var(--ic);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.imark svg{width:16px;height:16px;stroke-width:1.9}
.imark.sm{width:24px;height:24px;border-radius:8px}
.imark.sm svg{width:14px;height:14px}
.imark.big{width:44px;height:44px;border-radius:12px}
.imark.big svg{width:24px;height:24px}
.iname{display:block;font-weight:700;font-size:var(--f16);line-height:1.3}
.inote{display:block;font-size:var(--f14);color:var(--muted);margin-top:var(--s1);line-height:1.4}
.inote .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--act);margin-right:var(--s2)}
.icount{color:var(--muted);font-size:var(--f16)}
.listfoot{margin-top:var(--s5)}
.listfoot .btn.text{margin-left:calc(var(--s2) * -1)}

/* ---------- sheet pieces ---------- */
.crumb{display:inline-flex;align-items:center;gap:var(--s2);min-height:32px;color:var(--muted);font-size:var(--f14);font-weight:700;text-decoration:none;margin-bottom:var(--s2)}
a.crumb{min-height:44px;margin-left:calc(var(--s2) * -1);padding-left:var(--s2);padding-right:var(--s2);border-radius:8px}
a.crumb:hover{color:var(--act)}
.crumb .bk{font-size:var(--f22);line-height:1}
.sub{font-size:var(--f18);color:var(--ink);margin-top:var(--s1)}
.no{white-space:nowrap;color:var(--muted);font-size:var(--f14);margin-left:var(--s2);font-family:var(--body);font-weight:400;letter-spacing:0}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s3);background:#FBEFD9;color:#7A4A00;border-radius:12px;padding:var(--s4) var(--s5);margin:var(--s5) 0 var(--s6)}
.strip.calm{background:#F6F3EC;color:var(--ink)}
.strip svg{width:22px;height:22px}
.strip strong{font:600 var(--f18)/1.3 var(--head)}
.strip .ctx{margin-left:auto;font-size:var(--f14);color:var(--muted)}
.lab{display:block;font-weight:700;margin-bottom:var(--s2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s5)}
.chip{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:999px;border:1px solid var(--edge);background:transparent;cursor:pointer;font:500 var(--f16)/1 var(--head)}
.chip:hover{background:var(--tint)}
.chip[aria-checked="true"]{box-shadow:inset 0 0 0 1px var(--ink);border-color:var(--ink);background:#F6F3EC;font-weight:600}
.chip .ic{display:none;width:16px;height:16px}
.chip[aria-checked="true"] .ic{display:block}
.field{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:8px;padding:var(--s3) var(--s4);font:400 var(--f16)/1.6 var(--body);min-height:44px}
.field.err{border:2px solid var(--late)}
.letter{display:block;width:100%;color:var(--ink);border:1px solid var(--rule);background:#FCFAF6;border-radius:12px;padding:var(--s5);font:400 var(--f16)/1.65 var(--body);min-height:240px;resize:none;overflow:hidden}
.letter:focus-visible{outline-offset:0;border-radius:12px}
.lethead{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s1) var(--s3);margin-bottom:var(--s2)}
.lethead .lab{margin:0}
.qnote{font-size:var(--f14);color:var(--muted)}
.qlink{position:relative;display:inline}
.qlink button{background:none;border:0;padding:0;margin:0;color:var(--act);font:700 var(--f14)/1.5 var(--body);text-decoration:underline;text-underline-offset:4px;cursor:pointer;min-height:0}
.pop{position:absolute;left:0;top:calc(100% + var(--s2));z-index:5;width:320px;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(60,45,20,.08),0 12px 32px rgba(60,45,20,.18);padding:var(--s4) var(--s5);font-size:var(--f14);color:var(--ink)}
.pop[hidden]{display:none}
.pop b{display:block;margin-bottom:var(--s2);font-family:var(--head)}
.pop ul{margin:0;padding-left:var(--s5)}
.pop li+li{margin-top:var(--s1)}
.note{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0}
.note .who{font-weight:700;font-size:var(--f14)}
.note.flag{background:#F8E7DC;border-radius:12px;padding:var(--s4);margin-bottom:var(--s5)}
.note.flag .person{background:#fff}
.sfoot{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s4);margin-top:var(--s5);padding-bottom:var(--s5)}
.sfoot .fnote{color:var(--muted)}
.stside{display:none}
.stside h3{font:600 var(--f14)/1.3 var(--head);margin:0 0 var(--s1);color:var(--ink)}
.stside p{font-size:var(--f14);color:var(--muted);margin-bottom:var(--s5)}
.chair{margin:0 0 var(--s4)}
.chair b{font-weight:700}
.pubrow{display:flex;align-items:center;gap:var(--s3);min-height:44px;padding:var(--s2) var(--s3);margin:var(--s4) calc(var(--s3) * -1) 0;border-radius:12px;text-decoration:none;color:var(--muted)}
.pubrow:hover{background:#F6F3EC;color:var(--ink)}
.pubrow .pm{width:24px;height:24px;border-radius:8px;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.pubrow .pm svg{width:14px;height:14px}
.pubrow .ptag{font-size:var(--f14);color:var(--muted);margin-left:auto;white-space:nowrap}
.pubrow .pt{color:var(--ink);font-weight:700}

/* done */
.done{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:360px;max-width:480px;margin:0 auto;padding:var(--s6) 0}
.dtile{width:64px;height:64px;border-radius:20px;background:#E6EFEA;color:var(--done);display:flex;align-items:center;justify-content:center;margin-bottom:var(--s5)}
.dtile svg{width:32px;height:32px;stroke-width:2}
.done .sub{color:var(--muted);margin-top:var(--s3);text-wrap:balance}
.done .undo{margin-top:var(--s1);min-height:44px;display:flex;align-items:center}
.done .actions{margin-top:var(--s5)}

/* issue + bill rows */
.ihead{display:flex;align-items:center;gap:var(--s4)}
.ihead p{color:var(--muted);margin-top:var(--s1)}
.brows{list-style:none;padding:0;display:grid;gap:var(--s1);margin:var(--s5) 0 0}
.brow{display:grid;grid-template-columns:104px minmax(0,1fr) auto;grid-template-areas:"n n p" "t s s";gap:var(--s2) var(--s4);align-items:center;padding:var(--s4);margin:0 calc(var(--s4) * -1);border-radius:12px;text-decoration:none;color:inherit}
.brow:hover{background:#F7F4EC}
.brow .bn2{grid-area:n;font-weight:700;line-height:1.4}
.brow .trk{grid-area:t}
.brow .bst{grid-area:s;line-height:1.4}
.brow .bst.dead{color:var(--muted)}
.brow .pc{grid-area:p;justify-self:end}
.bno{white-space:nowrap;font-weight:400;color:var(--muted);font-size:var(--f14);margin-left:var(--s2)}
.mark{display:inline-flex;align-items:center;gap:var(--s1);font-size:var(--f14);font-weight:700;margin-left:var(--s3);color:var(--ink)}
.mark i{width:8px;height:8px;border-radius:50%;background:var(--act)}
.trk{display:block;width:104px;height:12px}
.ypill{display:inline-block;background:#E3F0F5;color:#005674;font:600 var(--f14)/1.3 var(--head);padding:var(--s1) var(--s3);border-radius:999px;white-space:nowrap}

/* bill sheet */
.h1row{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s1) var(--s3)}
.h1row .hn{color:var(--muted);font:400 var(--f16)/1 var(--body);letter-spacing:0}
.where{margin-top:var(--s5);background:#F8F5EE;border-radius:16px;padding:var(--s5);display:flex;flex-wrap:wrap;gap:var(--s4) var(--s5);align-items:center;justify-content:space-between}
.where dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3) var(--s5);flex:1 1 320px}
.where dt{font-size:var(--f14);color:var(--muted);padding-top:var(--s1)}
.where dd{margin:0}
.where .next{font-weight:700}
.bpath{list-style:none;margin:var(--s6) 0 0;padding:0;display:flex;--ic:var(--act)}
.bpath li{flex:1;position:relative;padding-top:var(--s7);text-align:center;color:var(--muted);font:600 var(--f14)/1.3 var(--head);padding-inline:var(--s1)}
.bpath li::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--rule)}
.bpath li:first-child::before{display:none}
.bpath li.reached,.bpath li.now{color:var(--ink)}
.bpath li.reached::before,.bpath li.now::before{background:var(--ic)}
.bpath .stop{position:absolute;top:0;left:50%;width:24px;height:24px;margin-left:-12px;display:flex;align-items:center;justify-content:center;z-index:1}
.bpath .stop::after{content:"";display:block;border-radius:50%}
.bpath .reached .stop::after{width:16px;height:16px;background:var(--ic)}
.bpath .next .stop::after{width:16px;height:16px;background:#fff;border:2px solid var(--edge)}
.bpath .now .stop::after{width:24px;height:24px;background:#fff;border:4px solid var(--ic)}
.bpath .nowtag{display:block;color:var(--ic);font-weight:700;margin-top:var(--s1)}
.bsplit{display:grid;gap:var(--s6);margin-top:var(--s7)}
.sec h2{font-size:var(--f18);margin-bottom:var(--s2);letter-spacing:0}
.sec+.sec{margin-top:var(--s5)}
.sec p+p{margin-top:var(--s2)}
.sec .lk{color:var(--act);font-weight:700}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:56px 1fr;gap:var(--s3);padding:var(--s1) 0}
.hist time{font-size:var(--f14);color:var(--muted);padding-top:var(--s1)}
.names{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s5)}
.bfoot{margin-top:var(--s6);padding-bottom:var(--s5)}

/* wide sheets */
.pn.wide h1+.lede{color:var(--muted);font-size:var(--f18);margin-top:var(--s1)}
.pn.wide{padding:var(--s5) var(--s4)}
.week{list-style:none;margin:var(--s5) 0 0;padding:0;display:grid;gap:var(--s3)}
.day{background:#FBF9F4;border-radius:16px;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-height:120px}
.day.today{background:#EAF3F6}
.dnm{font-size:var(--f14);color:var(--muted);font-weight:700;display:block}
.dnum{font:600 var(--f28)/1.2 var(--head);letter-spacing:-.02em}
.tdy{font-size:var(--f14);font-weight:700;color:var(--act);margin-left:var(--s2)}
.hcard{display:block;background:#fff;border-radius:12px;padding:var(--s3) var(--s4);box-shadow:var(--sh1);text-decoration:none;color:inherit}
.hcard:hover{box-shadow:0 1px 2px rgba(60,45,20,.08),0 4px 12px rgba(60,45,20,.1)}
.hcard .tm{display:block;font-weight:700;font-size:var(--f14);color:var(--act)}
.hcard .rt{display:block;font:600 var(--f16)/1.3 var(--head);margin-top:var(--s1)}
.hcard .rd{display:block;font-size:var(--f14);color:var(--muted);margin-top:var(--s1);line-height:1.4}
.none{color:var(--muted);font-size:var(--f14)}
.exgroups{display:grid;gap:var(--s6);margin-top:var(--s6)}
.exgroup h2{font-size:var(--f18);margin-bottom:var(--s2);letter-spacing:0}
.exgroup+.exgroup{margin-top:var(--s6)}
.exgroup ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--s1)}

function toast(msg,undo,ms){
  var t=document.getElementById('toast');clearTimeout(toastTimer);
  document.getElementById('toastMsg').textContent=msg;
  var u=document.getElementById('toastUndo');u.style.display=undo?'':'none';
  u.onclick=function(){t.classList.remove('on');clearTimeout(toastTimer);if(undo)undo();};
  t.classList.remove('on');void t.offsetWidth;t.classList.add('on');
  toastTimer=setTimeout(function(){t.classList.remove('on');},ms||10000);
}

/* ---------- search ---------- */
var scrim=document.getElementById('scrim'),sField=document.getElementById('sField'),sBtn=document.getElementById('searchBtn'),lastFocus=null;
function drawRes(q){
  var w=q.toLowerCase().split(/\s+/).filter(Boolean),h='',n=0;
  ISS.forEach(function(I){
    var bs=BL[I.id].filter(function(b){var t=(b.name+' '+b.n+' '+I.n).toLowerCase();return w.every(function(x){return t.indexOf(x)>-1;});});
    var im=w.every(function(x){return I.n.toLowerCase().indexOf(x)>-1;});
    if(w.length&&!bs.length&&!im)return;
    if(!w.length&&n>=4)return;
    n++;
    h+='<li><a class="xrow ires" href="#/issue/'+I.id+'">'+imark(I,'sm')+'<span><span class="rt">'+I.n+'</span><span class="rd">Issue · '+I.k+' bills</span></span></a>';
    if(w.length&&bs.length)h+='<ul class="sub2">'+bs.map(function(b){return '<li><a class="xrow" href="#/bill/'+b.id+'"><span class="rt">'+b.name+'<span class="no">'+b.n+'</span></span></a></li>';}).join('')+'</ul>';
    h+='</li>';
  });
  document.getElementById('sKick').textContent=q?(n?'Found by your words':'Nothing found. Try a topic or a name.'):'Suggestions';
  document.getElementById('sRes').innerHTML=h;
}
drawRes('');
sField.addEventListener('input',function(){drawRes(sField.value);});
function openSearch(){lastFocus=document.activeElement;scrim.classList.add('on');sBtn.classList.add('open');sField.value='';drawRes('');sField.focus();}
function closeSearch(){if(!scrim.classList.contains('on'))return;scrim.classList.remove('on');sBtn.classList.remove('open');if(lastFocus&&lastFocus.focus)lastFocus.focus();}
sBtn.addEventListener('click',openSearch);
document.getElementById('sClose').addEventListener('click',closeSearch);
scrim.addEventListener('click',function(e){if(e.target===scrim)closeSearch();});
scrim.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('a.xrow'))closeSearch();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeSearch();
  var t=e.target,tg=t&&t.tagName;
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&tg!=='INPUT'&&tg!=='TEXTAREA'&&tg!=='SELECT'&&!(t&&t.isContentEditable)&&!scrim.classList.contains('on')&&LAP.matches&&!bar.classList.contains('off')){e.preventDefault();openSearch();}
  if(e.key==='Tab'&&scrim.classList.contains('on')){
    var f=[].slice.call(scrim.querySelectorAll('input,button,a')),a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
  }
});

/* ---------- router ---------- */
var app=document.getElementById('app'),bar=document.getElementById('bar'),root=document.documentElement;
function route(){
  clearTimeout(tick);clearTimeout(toastTimer);document.getElementById('toast').classList.remove('on');closeSearch();
  var p=(location.hash||'#/').slice(1)||'/',m,lap=LAP.matches;
  if(p==='/calm')calmMode=true;else if(p==='/')calmMode=false;
  if(p==='/done')FIN[lastStep]=1;
  var rem=remaining();
  var v={key:'home',title:'Home',inner:'',bind:null,cls:'',sel:{},list:true,wide:false,chrome:true,back:'',phoneBare:false};
  if(p==='/'||p==='/calm'){
    v.home=true;
    if(rem.length){v.sel.step=rem[0].id;v.inner=StepInner(rem[0].id);v.bind=StepBind;v.cls=' stepn';}
    else{v.sel.issue=ISS[0].id;v.inner=IssueInner(ISS[0].id);}
  }
  else if((m=p.match(/^\/do\/(\w+)$/))){var sid=m[1]==='hearing'?'ask':m[1];v.sel.step=sid;v.inner=StepInner(sid);v.bind=StepBind;v.cls=' stepn';v.back='Back to Home';v.title='Step';v.phoneBare=true;v.chrome=false;}
  else if(p==='/done'){v.inner=DoneInner();v.bind=DoneBind;v.title='Done';v.phoneBare=true;v.chrome=false;}
  else if(p==='/deadline'||p==='/session'){v.sel.sess=1;v.inner=SessionInner(calmMode);v.back='Back to Home';v.title='The session';}
  else if((m=p.match(/^\/issue\/(\w+)$/))){v.sel.issue=iss(m[1]).id;v.inner=IssueInner(v.sel.issue);v.back='Back to Home';v.title='Issue';}
  else if((m=p.match(/^\/bill\/(\w+)$/))){var b=findBill(m[1]);v.sel.issue=b?b.iss:'tobacco';v.inner=BillInner(m[1]);v.title='Bill';}
  else if(p==='/bills'){v.list=false;v.wide=true;v.inner=BillsInner();v.bind=BillsBind;v.key='explore';v.back='Back to Explore';v.title='All bills';}
  else if(p==='/explore'){v.list=false;v.wide=true;v.inner=ExploreInner();v.key='explore';v.title='Explore';}
  else if(p==='/calendar'){v.list=false;v.wide=true;v.cls=' cal';v.inner=CalendarInner();v.key='calendar';v.title='Calendar';}
  else if(p.indexOf('/public/')===0){v.pub=true;v.bind=PublicBind;v.title='Public mode';v.chrome=false;}
  else{location.hash='#/';return;}
  var pub=!!v.pub,html='',wsOn=false;
  var lo={rem:rem,calm:calmMode,step:v.sel.step,issue:v.sel.issue,sess:v.sel.sess};
  if(pub)html=Public();
  else if(lap){
    wsOn=true;
    var old=document.getElementById('wl'),st=old?old.scrollTop:0;
    var sheet='<div class="wp"><div class="paper" id="paper"><div class="pn'+(v.wide?' wide':'')+v.cls+' enter">'+v.inner+'</div></div></div>';
    html=v.list?'<div class="ws"><div class="wl" id="wl">'+ListInner(lo)+'</div>'+sheet+'</div>':'<div class="ws one">'+sheet+'</div>';
    app.innerHTML=html;
    var nl=document.getElementById('wl');if(st&&nl)nl.scrollTop=st;
  }
  else if(v.home){lo.phone=true;lo.step='';lo.issue='';html='<div class="page">'+ListInner(lo)+'</div>';}
  else html='<div class="page'+(v.phoneBare?' bare':'')+'">'+(v.back?'<a class="back" href="'+(v.back==='Back to Explore'?'#/explore':'#/')+'">'+ic('left')+v.back+'</a>':'')+'<div class="paper"><div class="pn'+(v.wide?' wide':'')+v.cls+' enter">'+v.inner+'</div></div></div>';
  root.dataset.mode=pub?'public':'staff';
  if(!wsOn)app.innerHTML=html;
  var chrome=lap?!pub:v.chrome;
  document.body.classList.toggle('isws',wsOn);root.classList.toggle('isws',wsOn);
  bar.classList.toggle('off',!chrome);
  document.body.classList.toggle('hasbar',chrome);
  document.querySelectorAll('.bi[data-k]').forEach(function(x){if(x.getAttribute('data-k')===v.key&&x.tagName==='A')x.setAttribute('aria-current','page');else x.removeAttribute('aria-current');});
  var h1=app.querySelector('h1');if(h1)h1.setAttribute('tabindex','-1');
  document.title=v.title+' · Staff app, look A';
  window.scrollTo(0,0);
  var pp=document.getElementById('paper');if(pp)pp.scrollTop=0;
  document.querySelectorAll('[data-go]').forEach(function(e){e.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();location.hash=e.getAttribute('data-go');});});
  document.querySelectorAll('[data-got]').forEach(function(e){e.addEventListener('click',function(ev){
    ev.preventDefault();var id=e.getAttribute('data-got');GOT[id]=1;route();
    toast('Closed. You can still find it in its issue.',function(){delete GOT[id];route();},10000);});});
  if(v.bind)v.bind();
}
window.toast=toast;
window.addEventListener('hashchange',route);
if(LAP.addEventListener)LAP.addEventListener('change',route);
route();
})();
</script>
</body>
</html>
