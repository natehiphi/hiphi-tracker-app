<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff app, look A3: Paper workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --f14:14px;--f16:16px;--f18:18px;--f22:22px;--f28:28px;
  --bg:#F3EFE6;--ink:#1C1915;--muted:#5C554B;--rule:#E3DED3;--edge:#8A8277;
  --act:#00698E;--act-p:#005674;--on-act:#FFFFFF;--surface:#FFFFFF;--tint:#EAE5D8;--ring:#00698E;
  --amber:#7A4A00;--wash-amber:#FBEFD9;--late:#B3261E;--done:#2E7650;--plum:#2E1533;
  --head:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Lato',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sh1:0 1px 2px rgba(60,45,20,.06);
  --sheet:0 1px 2px rgba(60,45,20,.06),0 12px 32px rgba(60,45,20,.08);
  --ease:cubic-bezier(.2,.7,.2,1);
}
:root[data-mode="public"]{
  --bg:#2E1533;--ink:#FFF4E6;--muted:#E0CBDD;--rule:#5A3A61;--edge:#C79BB8;
  --act:#F6C9D4;--act-p:#EBB0BF;--on-act:#2E1533;--surface:#3C1F44;--tint:#3C1F44;--ring:#F6C9D4;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--f16)/1.55 var(--body);min-height:100vh}
h1,h2,h3{font-family:var(--head);font-weight:600;margin:0;color:var(--ink)}
h1{font-size:var(--f28);line-height:1.2;letter-spacing:-.02em}
h2{font-size:var(--f22);line-height:1.25;letter-spacing:-.02em}
h3{font-size:var(--f18);line-height:1.3}
h1:focus{outline:none}
p{margin:0}
ul,ol{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:var(--s4);top:-80px;background:var(--ink);color:var(--bg);padding:var(--s3) var(--s4);z-index:100;border-radius:8px}
.skip:focus{top:var(--s2)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.enter{animation:enter .2s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s5);border-radius:8px;border:1px solid transparent;font:600 var(--f16)/1 var(--head);cursor:pointer;text-decoration:none;text-align:center;background:none}
.btn.filled{background:var(--act);color:var(--on-act)}
.btn.filled:hover,.btn.filled:active{background:var(--act-p)}
.btn.quiet{border-color:var(--edge);color:var(--ink);background:transparent}
.btn.quiet:hover{background:var(--tint)}
.btn.text{color:var(--act);padding:0 var(--s2);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;font-family:var(--body);font-weight:700}
.btn.text:hover{color:var(--act-p);text-decoration-thickness:2px}
:root[data-mode="public"] .btn.text:hover{color:#fff}
.btn.is-loading{pointer-events:none;background:var(--act-p);color:var(--on-act)}
.btn:disabled{background:var(--tint);color:var(--muted);cursor:not-allowed}
.btn.big{min-height:48px;padding:0 var(--s6)}

/* ---------- rail (phone: bottom bar) ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.bar ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
.bar .brand,.bar .who{display:none}
.bi{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);min-height:64px;padding:var(--s2);background:none;border:0;text-decoration:none;color:var(--muted);font:500 var(--f14)/1.2 var(--head);cursor:pointer;width:100%}
.bi[aria-current="page"],.bi.open{color:var(--ink);font-weight:700}
.rpill{display:flex;align-items:center;justify-content:center;width:48px;height:32px;border-radius:16px}
.bi[aria-current="page"] .rpill,.bi.open .rpill{background:#fff}
.bar.off{display:none}
.person{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#fff;font:600 var(--f14)/1 var(--head);color:var(--ink);flex:none}
.person.sm{width:32px;height:32px;background:var(--tint)}

/* ---------- phone page frame ---------- */
.page{max-width:680px;margin:0 auto;padding:var(--s5) var(--s4) calc(var(--s8) + var(--s7) + env(safe-area-inset-bottom))}
.page.bare{padding-bottom:var(--s8)}
.page.wide{max-width:960px}
.page .paper{margin-top:var(--s6)}
.back{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;color:var(--act);text-decoration:none;font-weight:700;margin:0 0 var(--s2) calc(var(--s2) * -1);padding:0 var(--s2)}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.paper{background:#fff;border-radius:16px;box-shadow:var(--sheet);container-type:inline-size;overflow:hidden}

/* ---------- the left column: type and space only ---------- */
.gdate{font:400 var(--f14)/1.4 var(--body);color:var(--muted);margin:0}
.answer{font:500 var(--f22)/1.3 var(--head);letter-spacing:-.02em;margin-top:var(--s4);max-width:22em}
.answer.clear{font-size:var(--f28);line-height:1.25}
.notes3{margin-top:var(--s4);display:grid;gap:var(--s1)}
.note3{display:flex;align-items:flex-start;gap:var(--s3);min-height:44px;padding:var(--s2) 0;font-size:var(--f16);line-height:1.4;text-decoration:none;color:var(--ink)}
.note3 svg.ic{margin-top:2px}
.note3.risk{color:var(--amber)}
.note3 span{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.note3:hover span{text-decoration-thickness:2px}
.note3:not(.risk) svg.ic{color:var(--muted)}
.later{font-size:var(--f14);color:var(--muted);padding:var(--s3) 0 var(--s1)}
.lh{font:600 var(--f16)/1.3 var(--head);margin:var(--s5) 0 var(--s2)}
.srows3{list-style:none;margin:0;padding:0}
.sr3{position:relative;display:flex;align-items:center;gap:var(--s2);min-height:48px;padding:var(--s1) var(--s2) var(--s1) var(--s3);margin:0 calc(var(--s3) * -1);border-radius:12px;text-decoration:none;color:var(--ink)}
.sr3 svg.ic{color:var(--muted)}
.sr3 .sv{flex:1;min-width:0;line-height:1.35}
.sr3 .sv b{font-weight:700}
.sr3:hover .sv b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.sr3.sel{background:#fff}
.sr3.sel::before{content:"";position:absolute;left:0;top:var(--s3);bottom:var(--s3);width:3px;border-radius:2px;background:var(--act)}
.stm{flex:none;display:inline-flex;align-items:center;gap:var(--s1);font-size:var(--f14);color:var(--muted)}
.stm svg.ic{width:16px;height:16px;color:inherit}
.stm.soon{color:var(--amber);font-weight:700}
.stm.risk{color:var(--muted)}
.stm.risk svg.ic{color:var(--amber)}
.sr3.more{color:var(--muted);font-size:var(--f14);min-height:44px}
.clinks{margin-top:var(--s3)}
.cl{display:flex;align-items:flex-start;gap:var(--s2);min-height:44px;padding:var(--s2) 0;color:var(--muted);font-size:var(--f14);line-height:1.5;text-decoration:none}
.cl span{flex:1}
.cl svg.ic{width:16px;height:16px;margin-top:var(--s1)}
.cl:hover,.cl.sel{color:var(--ink)}
.cl:hover span{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.cl.sel{font-weight:700}
.calmnote{color:var(--muted);margin-top:var(--s5)}

/* ---------- sheet pieces ---------- */
.crumb{display:inline-flex;align-items:center;gap:var(--s2);min-height:32px;color:var(--muted);font-size:var(--f14);font-weight:700;text-decoration:none;margin-bottom:var(--s2)}
a.crumb{min-height:32px;border-radius:8px}
a.crumb:hover{color:var(--act)}
.crumb .bk{font-size:var(--f22);line-height:1}
.no{white-space:nowrap;color:var(--muted);font-size:var(--f14);margin-left:var(--s2);font-family:var(--body);font-weight:400;letter-spacing:0}
.pn.stepn .strip{max-width:640px}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s3);background:var(--wash-amber);color:var(--amber);border-radius:12px;padding:var(--s4) var(--s5);margin:0 0 var(--s6)}
.strip.calm{background:#F6F3EC;color:var(--ink)}
.strip svg.ic{width:22px;height:22px}
.strip strong{font:600 var(--f18)/1.3 var(--head)}
.strip .ctx{margin-left:auto;font-size:var(--f16);color:var(--muted)}
.strip .stx{flex:1 1 320px;font-size:var(--f16)}
.strip .btn{margin-left:auto;background:rgba(255,255,255,.6);border-color:var(--amber);color:var(--amber)}
.lab{display:block;font-weight:700;margin-bottom:var(--s2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s5)}
.chip{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:999px;border:1px solid var(--edge);background:transparent;cursor:pointer;font:500 var(--f16)/1 var(--head)}
.chip:hover{background:var(--tint)}
.chip[aria-checked="true"]{box-shadow:inset 0 0 0 1px var(--ink);border-color:var(--ink);background:#F6F3EC;font-weight:600}
.chip .ic{display:none;width:16px;height:16px}
.chip[aria-checked="true"] .ic{display:block}
.field{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:8px;padding:var(--s3) var(--s4);font:400 var(--f16)/1.6 var(--body);min-height:44px}
.letter{display:block;width:100%;color:var(--ink);border:1px solid var(--rule);background:#FCFAF6;border-radius:12px;padding:var(--s5);font:400 var(--f16)/1.65 var(--body);min-height:240px;resize:none;overflow:hidden}
.letter:focus-visible{outline-offset:0;border-radius:12px}
.letter.ro{white-space:pre-wrap}
.lethead{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s1) var(--s3);margin-bottom:var(--s2)}
.lethead .lab{margin:0}
.qnote{font-size:var(--f14);color:var(--muted)}
.qlink{position:relative;display:inline}
.qlink button{background:none;border:0;padding:0;margin:0;color:var(--act);font:700 var(--f14)/1.5 var(--body);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.pop{position:absolute;left:0;top:calc(100% + var(--s2));z-index:5;width:320px;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(60,45,20,.08),0 12px 32px rgba(60,45,20,.18);padding:var(--s4) var(--s5);font-size:var(--f14);color:var(--ink)}
.pop[hidden]{display:none}
.pop b{display:block;margin-bottom:var(--s2);font-family:var(--head)}
.pop ul{margin:0;padding-left:var(--s5)}
.pop li+li{margin-top:var(--s1)}
.note{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0}
.note .who{font-weight:700;font-size:var(--f14)}
.note.flag{background:#F8E7DC;border-radius:12px;padding:var(--s4);margin-bottom:var(--s5)}
.note.flag .person{background:#fff}
.sfoot{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s4);margin-top:var(--s5);padding-bottom:var(--s5)}
.sfoot .fnote{color:var(--muted)}
.stside{display:none}
.stside h3{font:600 var(--f14)/1.3 var(--head);margin:0 0 var(--s1);color:var(--ink)}
.stside p{font-size:var(--f16);color:var(--muted);margin-bottom:var(--s5)}
.chair{margin:0 0 var(--s4)}
.chair b{font-weight:700}
.toaddr{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);margin:0 0 var(--s4)}
.toaddr b{font-weight:700}
.pubrow{display:flex;align-items:center;gap:var(--s3);min-height:44px;padding:var(--s2) var(--s3);margin:var(--s4) calc(var(--s3) * -1) 0;border-radius:12px;text-decoration:none;color:var(--muted)}
.pubrow:hover{background:#F6F3EC;color:var(--ink)}
.pm{width:24px;height:24px;border-radius:8px;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.pm svg{width:14px;height:14px}
.pubrow .ptag{font-size:var(--f14);color:var(--muted);margin-left:auto;white-space:nowrap}
.pubrow .pt{color:var(--ink);font-weight:700}
.actrow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--s4)}
.actrow .alt{display:flex;flex-direction:column;gap:var(--s1)}
.actrow .ptag{font-size:var(--f14);color:var(--muted)}

/* header band */
.pn{min-height:100%;display:flex;flex-direction:column}
.pn{--px:var(--s4)}
.pbody{flex:1;display:flex;flex-direction:column;padding:var(--s5) var(--px) 0}
.hband{display:flex;align-items:center;gap:var(--s4);background:var(--wash,#F7F4EC);padding:var(--s5) var(--px);min-height:132px}
.hband.neutral{--wash:#F7F4EC}
.hband .ht{min-width:0}
.hband h1{font-size:var(--f28)}
.hband .bsub{font-size:var(--f18);margin-top:var(--s1);color:var(--ink)}
.hband .crumb{margin-bottom:0;min-height:24px}
.hband .hn{color:var(--muted);font:400 var(--f16)/1 var(--body);letter-spacing:0;margin-left:var(--s3)}
.imark{width:28px;height:28px;border-radius:8px;background:var(--ic);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.imark svg{width:16px;height:16px;stroke-width:1.9}
.imark.sm{width:24px;height:24px}
.imark.sm svg{width:14px;height:14px}
.imark.big{width:40px;height:40px;border-radius:12px}
.imark.big svg{width:22px;height:22px}
.lead{font-size:var(--f16);color:var(--ink);margin:0 0 var(--s5)}
.h18{font:600 var(--f18)/1.3 var(--head);margin:0 0 var(--s3)}

/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:360px;max-width:480px;margin:0 auto;padding:var(--s6) 0}
.dtile{width:64px;height:64px;border-radius:20px;background:#E6EFEA;color:var(--done);display:flex;align-items:center;justify-content:center;margin-bottom:var(--s5)}
.dtile svg{width:32px;height:32px;stroke-width:2}
.done .sub{font-size:var(--f18);color:var(--muted);margin-top:var(--s3);text-wrap:balance}
.done .left{color:var(--muted);margin-top:var(--s2);font-size:var(--f14)}
.segs{display:flex;gap:var(--s1);margin-top:var(--s4);width:200px}
.segs i{flex:1;height:8px;border-radius:4px;background:#E3DED3}
.segs i.on{background:var(--act)}
.errt{color:var(--late);font-size:var(--f14);margin-top:var(--s2)}
.field.err{border:2px solid var(--late)}
.done .undo{margin-top:var(--s2);min-height:44px;display:flex;align-items:center;gap:var(--s1);color:var(--muted)}
.done .actions{margin-top:var(--s4)}

/* issue + bill rows */
.brows{list-style:none;padding:0;display:grid;gap:var(--s1);margin:0}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n p" "t t" "s s";gap:var(--s2) var(--s4);align-items:start;padding:var(--s4);margin:0 calc(var(--s4) * -1);border-radius:12px;text-decoration:none;color:inherit}
.brow:hover{background:#F7F4EC}
.brow .bn2{grid-area:n;font-weight:700;line-height:1.4}
.brow .trk{grid-area:t}
.brow .bst{grid-area:s;line-height:1.4}
.brow .bst.dead{color:var(--muted)}
.brow .pc{grid-area:p;justify-self:end;align-self:center}
.bno{white-space:nowrap;font-weight:400;color:var(--muted);font-size:var(--f14);margin-left:var(--s2)}
.mark{display:inline-flex;align-items:center;gap:var(--s1);font-size:var(--f14);font-weight:700;margin-left:var(--s3)}
.mark i{width:8px;height:8px;border-radius:50%;background:var(--act)}
.trk{display:block;width:240px;max-width:100%;height:58px}
.trk.wide{width:100%;max-width:640px;height:auto;margin-top:var(--s6)}
.trk .tl.now{fill:#1C1915;font-weight:700}
.trk .tl{font:400 14px 'Lato',sans-serif;fill:#5C554B}
.ypill{display:inline-block;background:#E3F0F5;color:#005674;font:600 var(--f14)/1.3 var(--head);padding:var(--s1) var(--s3);border-radius:999px;white-space:nowrap}
.ypill.wait{background:#EFEAE0;color:var(--ink)}
.already{color:var(--muted)}
.dl2{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n p";align-items:center}
.dl2 .bn2{display:flex;align-items:center;gap:var(--s3);text-decoration:none;font-weight:700}
.dh{margin:var(--s6) 0 var(--s2)}

/* bill sheet */
.where{background:#F8F5EE;border-radius:16px;padding:var(--s5);display:flex;flex-wrap:wrap;gap:var(--s4) var(--s5);align-items:center;justify-content:space-between}
.where dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3) var(--s5);flex:1 1 320px}
.where dt{font-size:var(--f14);color:var(--muted);padding-top:var(--s1)}
.where dd{margin:0}
.where .next{font-weight:700}
.where p+p{margin-top:var(--s2)}

.bsplit{display:grid;gap:var(--s6);margin-top:var(--s7)}
.sec h2{font-size:var(--f18);margin-bottom:var(--s2);letter-spacing:0}
.sec+.sec{margin-top:var(--s5)}
.sec p+p{margin-top:var(--s2)}
.sec .lk,.lk{color:var(--act);font-weight:700}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:56px 1fr;gap:var(--s3);padding:var(--s1) 0}
.hist time{font-size:var(--f14);color:var(--muted);padding-top:var(--s1)}
.names{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s5)}
.bfoot{margin-top:var(--s6);padding-bottom:var(--s5)}
.notef{margin-top:var(--s6);max-width:640px;padding-bottom:var(--s6)}
.listfoot{margin-top:var(--s5)}

/* Your week */

.wband{background:#F7F4EC;padding:var(--s5) var(--px) var(--s4);min-height:132px;display:flex;align-items:flex-end}
.wst{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%}
.wst li{text-align:center}
.wm{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:var(--s2);align-items:flex-end;align-content:flex-end;min-height:64px;padding:0 var(--s1) var(--s3);border-bottom:2px solid #D9D2C3}
.wst li.today .wm{border-bottom-color:var(--act)}
.wd{font-size:var(--f14);color:var(--muted);padding-top:var(--s2)}
.wst li.today .wd{color:var(--act);font-weight:700}
.tdy2{display:block;font-size:var(--f14)}
.mk{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;flex:none}
.mk.step{background:var(--ic)}
.mk.step.fin{width:22px;height:22px}
.mk.step svg.ic{width:14px;height:14px;color:#fff;stroke-width:2.5}
.mk.ring{border:2px solid var(--ic);background:#fff}
.mk.flag{width:20px;height:20px;border-radius:0;color:var(--amber)}
.mk.flag svg.ic{width:20px;height:20px}
.sunm{width:48px;height:32px}
.wk{padding-bottom:var(--s6)}
.xrow.hr3{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:var(--s4);align-items:start;margin-top:var(--s1)}
.hr3 .hrt{font-size:var(--f14);color:var(--muted);padding-top:2px}
.hr3 .hrn b{display:block;font-weight:700}
.hr3 .hrn .x,.hr3 .hrd{font-size:var(--f14);color:var(--muted);display:block}
.hr3 .hrd{text-align:right;padding-top:2px}
.hr3.dl{margin-top:var(--s5)}
.hr3.dl .hrn b{color:var(--amber)}

  if(p==='/calm')calmMode=true;else if(p==='/')calmMode=false;
  if(p==='/done'&&lastStep!=='file')FIN[lastStep]=1;
  if((m=p.match(/^\/do\/(\w+)$/))&&FIN[m[1]]&&!OUT_KEEP)delete FIN[m[1]];
  if(p==='/news')NEWSREAD=true;
  var v={key:'home',title:'Home',inner:'',bind:null,cls:'',sel:{},list:true,wide:false,chrome:true,back:'',phoneBare:false};
  if(p==='/'||p==='/calm'){v.home=true;v.inner=WeekInner();}
  else if((m=p.match(/^\/do\/(\w+)$/))){var sid=m[1]==='hearing'?'ask':m[1];v.sel.step=sid;v.inner=StepInner(sid);v.bind=StepBind;v.cls=' stepn';v.back='Back to Home';v.title='Step';v.phoneBare=true;}
  else if(p==='/done'){v.inner=DoneInner();v.bind=DoneBind;v.title='Done';v.phoneBare=true;}
  else if(p==='/deadline'||p==='/session'){v.inner=SessionInner();v.back='Back to Home';v.title='The session';}
  else if(p==='/steps'){v.inner=StepsInner();v.back='Back to Home';v.title='Your steps';}
  else if(p==='/news'){v.sel.link='news';v.inner=NewsInner();v.back='Back to Home';v.title='What stopped';}
  else if(p==='/issues'){v.sel.link='issues';v.inner=IssuesInner();v.back='Back to Home';v.title='Your issues';}
  else if(p==='/alert'){v.inner=AlertInner();v.back='Back to Home';v.title='How it reaches you';}
  else if((m=p.match(/^\/issue\/(\w+)$/))){v.inner=IssueInner(m[1]);v.back='Back to Home';v.title='Issue';}
  else if((m=p.match(/^\/bill\/(\w+)$/))){v.inner=BillInner(m[1]);v.title='Bill';}
  else if(p==='/bills'){v.list=false;v.wide=true;v.inner=BillsInner();v.bind=BillsBind;v.key='explore';v.back='Back to Explore';v.title='All bills';}
  else if(p==='/explore'){v.list=false;v.wide=true;v.inner=ExploreInner();v.key='explore';v.title='Explore';}
  else if(p==='/samples'){v.list=false;v.wide=true;v.inner=SamplesInner();v.key='explore';v.title='Sample pages';}
  else if(p==='/calendar'){v.list=false;v.wide=true;v.inner=CalendarInner();v.bind=CalendarBind;v.key='calendar';v.title='Calendar';}
  else if((m=p.match(/^\/public\/(\w+)$/))){v.pub=true;v.pid=m[1];v.bind=PublicBind;v.title='Public mode';v.chrome=false;}
  else{location.hash='#/';return;}
  var pub=!!v.pub,html='',wsOn=false;
  var lo={step:v.sel.step,link:v.sel.link};
  if(pub)html=Public(v.pid);
  else if(lap){
    wsOn=true;
    var old=document.getElementById('wl'),st=old?old.scrollTop:0;
    var sheet='<div class="wp"><div class="paper" id="paper"><div class="pn'+(v.wide?' wide':'')+v.cls+' enter">'+v.inner+'</div></div></div>';
    html=v.list?'<div class="ws"><div class="wl" id="wl">'+ListInner(lo)+'</div>'+sheet+'</div>':'<div class="ws one">'+sheet+'</div>';
    app.innerHTML=html;
    var nl=document.getElementById('wl');if(st&&nl)nl.scrollTop=st;
  }
  else if(v.home){lo.phone=true;html='<div class="page">'+ListInner(lo)+'<div class="paper"><div class="pn enter">'+v.inner+'</div></div></div>';}
  else html='<div class="page'+(v.phoneBare?' bare':'')+'">'+(v.back?'<a class="back" href="'+(v.back==='Back to Explore'?'#/explore':'#/')+'">'+ic('left')+v.back+'</a>':'')+'<div class="paper"><div class="pn'+(v.wide?' wide':'')+v.cls+' enter">'+v.inner+'</div></div></div>';
  root.dataset.mode=pub?'public':'staff';
  if(!wsOn)app.innerHTML=html;
  var chrome=lap?!pub:(!pub&&(v.chrome&&!v.phoneBare));
  document.body.classList.toggle('isws',wsOn);root.classList.toggle('isws',wsOn);
  bar.classList.toggle('off',!chrome);
  document.body.classList.toggle('hasbar',chrome);
  document.querySelectorAll('.bi[data-k]').forEach(function(x){if(x.getAttribute('data-k')===v.key&&x.tagName==='A')x.setAttribute('aria-current','page');else x.removeAttribute('aria-current');});
  var h1=app.querySelector('h1');if(h1)h1.setAttribute('tabindex','-1');
  document.title=v.title+' · Staff app, look A3';
  window.scrollTo(0,0);
  var pp=document.getElementById('paper');if(pp)pp.scrollTop=0;
  if(v.bind)v.bind();
}
window.toast=toast;
window.addEventListener('hashchange',route);
if(LAP.addEventListener)LAP.addEventListener('change',route);
route();
})();
</script>
</body>
</html>
