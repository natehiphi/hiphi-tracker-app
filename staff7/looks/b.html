<!doctype html>
<html lang="en" data-mode="tracker">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Bill tracker · Look B, Lagoon</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --bg:#F1F6F8;--surface:#FFFFFF;--ink:#142B35;--ink2:#3F5662;
  --accent:#00698E;--accent-press:#005674;--accent-hover:#005F80;--tint:#E1F0F5;
  --head:#142B35;--edge:#6F8B98;--line:#DCE7EC;
  --late:#B3261E;--soon:#8A5A00;--back:#7A2E6E;--done:#2E7650;
  --shadow:0 1px 2px rgba(20,60,80,.04),0 4px 16px rgba(20,60,80,.04);
  --ring:#00698E;
  --wash:linear-gradient(165deg,#CBE6EE 0%,#DDEEEE 52%,#F1F6F8 100%);
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[data-mode="public"]{
  --bg:#FFF4EA;--surface:#FFFBF7;--ink:#3A1F12;--ink2:#6B4330;
  --accent:#A8430F;--accent-press:#85330A;--accent-hover:#963B0C;--tint:#FBE1CC;
  --head:#8A3410;--edge:#A9795A;--line:#EED6C2;
  --shadow:0 1px 2px rgba(120,60,20,.04),0 4px 16px rgba(120,60,20,.05);
  --ring:#A8430F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Lato,system-ui,sans-serif;min-height:100vh;transition:background-color .2s var(--ease)}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;font-weight:600;color:var(--head);margin:0;line-height:1.25}
h1{font-size:28px;letter-spacing:-.02em}
h2{font-size:22px;letter-spacing:-.02em}
h3{font-size:18px}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:8px}
h1[tabindex="-1"]:focus,main:focus{outline:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:var(--s4);top:-64px;background:var(--surface);padding:var(--s3) var(--s4);border-radius:999px;z-index:100}
.skip:focus{top:var(--s2)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}

/* layout */
.wrap{max-width:680px;margin:0 auto;padding:0 var(--s4)}
.wrap.wide{max-width:1040px}
body[data-bars="on"] main{padding-bottom:96px}
main{padding-bottom:var(--s7)}
.page{animation:rise .22s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section{margin-top:var(--s6)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s3)}
.muted{color:var(--ink2)}
.sm{font-size:14px}

/* bars */
.topbar{display:none}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);box-shadow:0 -8px 32px rgba(20,60,80,.10);display:flex;padding:var(--s2) var(--s2) calc(var(--s2) + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
body[data-bars="off"] .botbar,body[data-bars="off"] .topbar{display:none!important}
.door{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);min-height:56px;border:0;background:none;text-decoration:none;color:var(--ink2);font-size:14px;font-weight:700;cursor:pointer;border-radius:16px}
.door .ico{display:grid;place-items:center;width:56px;height:32px;border-radius:999px;transition:background-color .15s}
.door[aria-current="page"]{color:var(--accent-press)}
.door[aria-current="page"] .ico{background:var(--tint);color:var(--accent)}
.door:active .ico{transform:scale(.96)}
@media (min-width:900px){
  .botbar{display:none}
  body[data-bars="on"] main{padding-bottom:var(--s7)}
  .topbar{display:block;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line)}
  .topbar .inner{max-width:1040px;margin:0 auto;padding:0 var(--s5);height:64px;display:flex;align-items:center;gap:var(--s5)}
  .brand{display:flex;align-items:center;gap:var(--s3);font:600 18px Poppins,sans-serif;letter-spacing:0;color:var(--ink);text-decoration:none;min-height:44px}
  .brand .mk{width:32px;height:32px;border-radius:50%;background:linear-gradient(150deg,#00698E,#3E9FA8);display:grid;place-items:center;color:#fff;font:600 14px Poppins,sans-serif}
  .topbar nav{display:flex;gap:var(--s1);margin-left:auto}
  .topbar .door{flex:none;flex-direction:row;gap:var(--s2);padding:0 var(--s4);min-height:44px;border-radius:999px}
  .topbar .door .ico{width:auto;height:auto;background:none!important}
  .topbar .door[aria-current="page"]{background:var(--tint)}
  .avatar-top{margin-left:var(--s2)}
  .wash .avatar{display:none}
}
.avatar{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--accent-press);display:grid;place-items:center;font:600 14px Poppins,sans-serif;box-shadow:var(--shadow)}
.avatar-top{display:none}
@media (min-width:900px){.avatar-top{display:grid;width:40px;height:40px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;padding:0 var(--s5);border-radius:999px;border:2px solid transparent;font:700 16px Lato,sans-serif;text-decoration:none;cursor:pointer;transition:background-color .15s,transform .15s,box-shadow .15s;line-height:1.2;text-align:center}
.btn-fill{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,80,110,.16)}
html[data-mode="public"] .btn-fill{box-shadow:0 2px 8px rgba(140,60,10,.18)}
.btn-fill:hover,.btn-fill.is-hover{background:var(--accent-hover)}
.btn-fill:active,.btn-fill.is-pressed{background:var(--accent-press);transform:translateY(1px) scale(.985);box-shadow:none}
.btn-quiet{background:var(--surface);color:var(--accent-press);border-color:var(--accent)}
.btn-quiet:hover,.btn-quiet.is-hover{background:var(--tint)}
.btn-quiet:active,.btn-quiet.is-pressed{background:var(--tint);transform:translateY(1px) scale(.985);border-color:var(--accent-press)}
.btn-text{background:none;color:var(--accent-press);min-height:44px;padding:0 var(--s2);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;border-radius:12px}
.btn-text:hover,.btn-text.is-hover{background:var(--tint)}
.btn-text:active,.btn-text.is-pressed{background:var(--tint);transform:scale(.98)}
.btn.is-focus{outline:3px solid var(--ring);outline-offset:2px}
.btn[disabled],.btn.is-disabled{background:#DCE6EA;color:#5B717C;border-color:transparent;box-shadow:none;cursor:not-allowed;text-decoration:none;transform:none}
.btn-quiet[disabled]{background:transparent;border-color:#B9CAD2}
.btn-text[disabled]{background:none}
.btn.is-loading{opacity:.85;cursor:progress;pointer-events:none}
.btn.block{width:100%}
@media (min-width:900px){.btn.block{width:auto}}

/* status marks */
.mark{display:inline-flex;align-items:center;gap:var(--s2);font-size:14px;font-weight:700;color:var(--ink)}
.mark svg{width:16px;height:16px}
.mark.ontime svg{color:var(--accent)}
.mark.soon svg{color:var(--soon)}.mark.soon{color:var(--soon)}
.mark.late svg{color:var(--late)}.mark.late{color:var(--late)}
.mark.back svg{color:var(--back)}.mark.back{color:var(--back)}
.mark.done svg{color:#2E7650}
.mark.plain{color:var(--ink)}

/* home */
.wash{background:var(--wash);padding:var(--s3) 0 var(--s4);border-radius:0 0 24px 24px}
.wash .date{font-size:14px;color:var(--ink2);font-weight:700}
.wash .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s1)}
.wash h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;color:var(--ink)}
.wash .sub{font:700 16px/1.4 Lato,sans-serif;color:#005674;margin-top:var(--s1)}
.wash .avatar{width:40px;height:40px;box-shadow:none}
@media (min-width:900px){.wash{padding:var(--s7) 0 var(--s7);border-radius:0 0 32px 32px}.wash .top{margin-bottom:var(--s4)}.wash h1{font-size:38px;line-height:1.15}.wash .sub{font:600 22px/1.3 Poppins,sans-serif;letter-spacing:-.02em;margin-top:var(--s3)}}
.step{display:grid;grid-template-columns:40px 1fr 16px;gap:var(--s3);align-items:center;padding:var(--s3) var(--s3) var(--s3) var(--s4);text-decoration:none;color:var(--ink);min-height:64px;transition:background-color .15s}
.step+.step{border-top:1px solid var(--line)}
.step:hover,.step.is-hover{background:#F6FAFB}
.step:active{background:var(--tint)}
.tile{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.tile svg{width:20px;height:20px}
.step .t{font:600 16px/1.3 Poppins,sans-serif;color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:0 var(--s2)}
.step .t .mark{font:700 14px Lato,sans-serif;white-space:nowrap}
.step .b{font-size:14px;color:var(--ink2);margin-top:var(--s1)}
.step .chev{color:var(--edge)}
.step .chev svg{width:16px;height:16px}
.group{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.mv{font-weight:700;color:var(--ink)}
.mv.you{color:var(--accent-press)}
.row .l2 .new{margin-left:var(--s2)}
.sh{font-size:18px;letter-spacing:0}
.row{display:grid;grid-template-columns:1fr 16px;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);text-decoration:none;color:var(--ink);min-height:56px;transition:background-color .15s}
.row+.row{border-top:1px solid var(--line)}
.row:hover,.row.is-hover{background:#F6FAFB}
html[data-mode="public"] .row:hover{background:#FFF2E6}
.row:active{background:var(--tint)}
.row .chev{color:var(--edge)}
.row .chev svg{width:16px;height:16px}
.row .l1{font-size:16px}
.row .no{font:600 16px Poppins,sans-serif;margin-right:var(--s2);color:var(--ink)}
.row .nm{font-weight:700}
.row .l2{font-size:14px;color:var(--ink2);margin-top:var(--s1)}
.row .l3{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center;margin-top:var(--s2);font-size:14px}
.pill{display:inline-flex;align-items:center;padding:var(--s1) var(--s3);border-radius:999px;background:var(--tint);color:var(--accent-press);font-weight:700;font-size:14px}
.wait{color:var(--ink2);font-weight:700;font-size:14px}
.new{display:inline-flex;align-items:center;gap:var(--s2);font-size:14px;font-weight:700;color:var(--accent-press)}
.new:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.calmcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:var(--s6) var(--s5);text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.calmcard .tile{width:64px;height:64px;background:linear-gradient(160deg,#D6EDF2,#E6F3EC)}
.calmcard p.big{font:600 22px/1.3 Poppins,sans-serif;letter-spacing:-.02em;color:var(--ink)}
.foot{margin-top:var(--s6);text-align:center}

/* step page */
.backlink{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s3) 0 var(--s2);margin:var(--s4) 0 var(--s2) calc(var(--s2) * -1);border-radius:999px;text-decoration:none;font-weight:700;color:var(--accent-press)}
.backlink:hover{background:var(--tint)}
.lead{font-size:18px;margin-top:var(--s2)}
.facts{margin-top:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap;border:0;padding:0;margin:var(--s5) 0 0}
.chips legend{font-weight:700;padding:0;margin-bottom:var(--s2)}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:999px;border:2px solid var(--edge);background:var(--surface);font-weight:700;transition:background-color .15s}
.chip input:checked+span{background:var(--tint);border-color:var(--accent);color:var(--accent-press)}
.chip input:focus-visible+span{outline:3px solid var(--ring);outline-offset:2px}
.chip input:not(:checked)+span svg{display:none}
.field{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s5)}
.field label,.field .lab{font-weight:700}
.field .hint{font-size:14px;color:var(--ink2);font-weight:400}
.fld,.ta,.sel{width:100%;min-height:48px;padding:var(--s3) var(--s4);border:2px solid var(--edge);border-radius:12px;background:var(--surface);color:var(--ink);font:400 16px/1.5 Lato,sans-serif}
.fld:hover,.ta:hover,.sel:hover{border-color:var(--ink2)}
.fld:focus,.ta:focus,.sel:focus{outline:3px solid var(--ring);outline-offset:1px;border-color:var(--accent)}
.ta{resize:vertical;min-height:112px}
.sel{appearance:none;-webkit-appearance:none;padding-right:48px;background:#FFFBF7 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%236B4330' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 16px center}
.ta.letter{min-height:352px;padding:var(--s5);font-size:16px;line-height:1.7;border-radius:20px}
.err{border-color:var(--late)}
.errmsg{display:flex;gap:var(--s2);align-items:center;color:var(--late);font-size:14px;font-weight:700}
.errmsg svg{width:16px;height:16px}
.actions{margin-top:var(--s5);display:flex;flex-direction:column;gap:var(--s3);align-items:stretch}
@media (min-width:900px){.actions{align-items:flex-start}}
.note{display:grid;grid-template-columns:40px 1fr;gap:var(--s3);align-items:start}
.note .av{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--accent-press);display:grid;place-items:center;font:600 14px Poppins,sans-serif}
.note .bd{padding:var(--s1) 0}
.note .who{font-size:14px;color:var(--ink2);font-weight:700}
.sentback{background:#F8EDF5;border-radius:20px;padding:var(--s4);margin-top:var(--s5);display:grid;gap:var(--s2)}

/* done */
.donewrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:var(--s7) var(--s4);gap:var(--s4)}
.donewrap .tile{width:80px;height:80px;background:#DCEFE3;color:#2E7650;box-shadow:0 0 0 12px #EEF7F1}
.donewrap .tile svg{width:40px;height:40px;stroke-width:2.25}
.donewrap p{max-width:32ch;font-size:18px}
.donewrap .actions{align-items:center;margin-top:var(--s3);width:100%;max-width:360px}
.donewrap .actions .btn{width:100%}
.donewrap .tile{margin-bottom:var(--s3)}

/* bill */
.pillno{display:inline-block;font:600 14px Poppins,sans-serif;color:var(--accent-press);background:var(--tint);padding:var(--s1) var(--s3);border-radius:999px;margin-top:var(--s5)}
.billhead h1{margin-top:var(--s3)}
.statusline{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:var(--s4);margin-top:var(--s4);display:grid;gap:var(--s3)}
.statusline .s1{font-size:18px}
.statusline .s1 b{font-weight:700}
.path{list-style:none;margin:var(--s3) 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.path li{position:relative;text-align:center;font-size:14px;padding-top:var(--s6);color:var(--ink2);padding-inline:var(--s1)}
.path li:before{content:"";position:absolute;top:11px;left:0;right:0;height:3px;background:var(--line)}
.path li.past:before,.path li.now:before{background:var(--accent)}
.path li.now:after{background:var(--accent)}
.path li:first-child:before{left:50%}.path li:last-child:before{right:50%}
.path li.now:before{right:50%}
.path li .dot{position:absolute;top:4px;left:50%;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--line);z-index:1}
.path li.past .dot{background:var(--accent);border-color:var(--accent)}
.path li.now .dot{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 6px var(--tint);width:16px;height:16px}
.path li.now{color:var(--ink);font-weight:700}
.path li .nw{display:block;color:var(--accent-press);font-weight:700}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:var(--s5)}
dl.kv{margin:0;display:grid;grid-template-columns:1fr;gap:var(--s3)}
dl.kv>div{display:grid;gap:0}
dt{font-size:14px;color:var(--ink2);font-weight:700}
dd{margin:0}
@media (min-width:600px){dl.kv>div{grid-template-columns:160px 1fr;gap:var(--s4)}dt{padding-top:2px}}
.hist{list-style:none;margin:0;display:grid;gap:var(--s4)}
.hist li{display:grid;grid-template-columns:64px 1fr;gap:var(--s4)}
.hist time{font-weight:700;font-size:14px;color:var(--ink2);padding-top:2px}
.names{font-size:16px}
.name{display:inline}
.notes{display:grid;gap:var(--s4)}
.txtlink{font-weight:700;color:var(--accent-press);display:inline-flex;align-items:center;min-height:44px}
.pubrow{margin-top:var(--s7);border-top:1px solid var(--line);padding-top:var(--s3)}
.pubrow a{display:grid;grid-template-columns:1fr 24px;align-items:center;gap:var(--s3);min-height:56px;padding:0 var(--s2);color:var(--ink2);text-decoration:none;border-radius:12px;font-size:16px}
.pubrow a:hover{background:#E8F0F3;color:var(--ink)}

/* explore */
.lede{font-size:18px;color:var(--ink2);margin-top:var(--s2)}
.eg{margin-top:var(--s6)}
.eg h2{font-size:18px;letter-spacing:0;margin-bottom:var(--s3)}
.row.ex .nm{font-weight:700}
.eg.pub .group{background:#FFF1E3;box-shadow:0 1px 2px rgba(120,60,20,.06),0 12px 32px rgba(120,60,20,.08);border:2px solid #E7B891}
.eg.pub h2{color:#8A3410}
.eg.pub .row{color:#3A1F12}
.eg.pub .row+.row{border-top-color:#EACDB4}
.eg.pub .row:hover{background:#FFE7D1}
.eg.pub .row .l2{color:#6B4330}
.eg.pub .chev{color:#A9795A}
.eg.pub .opens{display:inline-flex;margin-bottom:var(--s3);padding:var(--s1) var(--s3);background:#A8430F;color:#fff;border-radius:999px;font-size:14px;font-weight:700}
.eg.pub .head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}

/* calendar */
.week{display:grid;gap:var(--s3);margin-top:var(--s5)}
.day{display:grid;grid-template-columns:64px 1fr;gap:var(--s4);align-items:start}
.datebox{text-align:center;padding:var(--s2) 0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);min-height:64px}
.datebox .dw{font-size:14px;font-weight:700;color:var(--ink2);display:block}
.datebox .dn{font:600 22px/1.2 Poppins,sans-serif;letter-spacing:-.02em;display:block}
.day.today .datebox{background:var(--accent);color:#fff}
.day.today .datebox .dw,.day.today .datebox .dn{color:#fff}
.day .empty{color:var(--ink2);padding:var(--s4) 0;font-size:16px}
.hear{display:grid;grid-template-columns:1fr 24px;gap:var(--s3);align-items:center;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:var(--s4);text-decoration:none;color:var(--ink);min-height:64px}
.hear:hover{box-shadow:0 2px 4px rgba(20,60,80,.06),0 16px 40px rgba(20,60,80,.13)}
.hear .tm{font-weight:700;font-size:14px;color:var(--accent-press)}
.hear .nm{font:600 18px/1.3 Poppins,sans-serif;margin-top:var(--s1)}
.hear .pl{color:var(--ink2);margin-top:var(--s1)}
.hear .chev{color:var(--edge)}

/* search overlay */
#search{position:fixed;inset:0;z-index:50;background:rgba(20,43,53,.42);display:none;align-items:flex-start;justify-content:center;padding:var(--s4)}
#search.open{display:flex}
.sheet{background:var(--surface);border-radius:20px;box-shadow:0 24px 64px rgba(20,43,53,.28);width:100%;max-width:560px;margin-top:var(--s5);padding:var(--s4);animation:rise .2s var(--ease) both}
.sheet .bar{display:flex;gap:var(--s2);align-items:center}
.sheet .fld{border-radius:999px;padding-left:var(--s5)}
.results{list-style:none;margin:var(--s3) 0 0;padding:0}
.results a{display:grid;grid-template-columns:1fr auto;gap:var(--s3);padding:var(--s3) var(--s4);min-height:56px;align-items:center;text-decoration:none;color:var(--ink);border-radius:16px}
.results a:hover{background:var(--tint)}
.results .k{font-size:14px;color:var(--ink2);font-weight:700}
.results .nm{font-weight:700}

/* toasts */
#toasts{position:fixed;left:var(--s4);right:var(--s4);bottom:var(--s4);z-index:60;display:flex;flex-direction:column;align-items:center;gap:var(--s2);pointer-events:none}
body[data-bars="on"] #toasts{bottom:96px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:var(--s4);background:#142B35;color:#fff;border-radius:20px;padding:var(--s2) var(--s2) var(--s2) var(--s5);box-shadow:0 16px 40px rgba(20,43,53,.3);max-width:520px;animation:rise .2s var(--ease) both;min-height:56px}
.toast .btn-text{color:#fff;text-decoration:underline}
.toast .btn-text:hover{background:rgba(255,255,255,.12)}
.toast :focus-visible{outline-color:#fff}

/* public mode */
.pband{position:sticky;top:0;z-index:30;background:#A8430F;color:#fff;box-shadow:0 8px 24px rgba(120,50,10,.25)}
.pband .inner{max-width:1040px;margin:0 auto;padding:var(--s3) var(--s4);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.pband .tx{display:flex;align-items:center;gap:var(--s3);font:600 16px Poppins,sans-serif}
.pband .btn{border-color:#fff;color:#fff;background:transparent;min-height:44px;padding:0 var(--s4)}
.pband .btn:hover{background:rgba(255,255,255,.16)}
.pband :focus-visible{outline-color:#fff}
.pgrid{display:grid;gap:var(--s6);margin-top:var(--s5)}
@media (min-width:900px){.pgrid{grid-template-columns:minmax(0,1fr) 360px;align-items:start;gap:var(--s7)}.preview{position:sticky;top:96px}}
.pgrid h1{color:#8A3410}
.switch{display:flex;align-items:center;gap:var(--s3);min-height:44px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:56px;height:44px;margin:0;cursor:pointer}
.switch .trk{width:56px;height:32px;border-radius:999px;background:#fff;border:2px solid var(--edge);position:relative;transition:background-color .15s;flex:none}
.switch .trk:after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--edge);transition:transform .18s var(--ease),background-color .15s}
.switch input:checked+.trk{background:var(--accent);border-color:var(--accent)}
.switch input:checked+.trk:after{transform:translateX(24px);background:#fff}
.switch input:focus-visible+.trk{outline:3px solid var(--ring);outline-offset:2px}
.switch{position:relative}
.preview .cap{font-weight:700;color:#8A3410;margin-bottom:var(--s3);display:flex;gap:var(--s2);align-items:center}
.pubcard{background:#fff;border:1px solid #D5E2E8;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);color:#142B35}
.pubcard .hd{padding:var(--s3) var(--s4);background:#F1F6F8;font:600 14px Poppins,sans-serif;color:#005674;border-bottom:1px solid #D5E2E8}
.pubcard .bd{padding:var(--s5);display:grid;gap:var(--s3)}
.pubcard .tag{font-size:14px;font-weight:700;color:#3F5662}
.pubcard h3{font-size:22px;letter-spacing:-.02em;color:#142B35}
.pubcard .ask{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:var(--s2) var(--s5);background:#00698E;color:#fff;border-radius:999px;font-weight:700}
.pubcard .until{font-size:14px;color:#3F5662}
.pubcard.off .bd{color:#3F5662}
.after{margin-top:var(--s5);display:grid;gap:var(--s3)}

/* parts */
.pt h2{margin-top:var(--s7);margin-bottom:var(--s4)}
.pt h3{margin:var(--s5) 0 var(--s3)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s3)}
.sw{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sw i{display:block;height:48px;border-bottom:1px solid rgba(0,0,0,.06)}
.sw div{padding:var(--s2) var(--s3);font-size:14px}
.sw b{display:block}
.tbl{display:grid;gap:var(--s2)}
.demo{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:var(--s4)}
.states{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s4) var(--s3);align-items:end}
.states .c{display:grid;gap:var(--s2);justify-items:start}
.states .c span.lab{font-size:14px;color:var(--ink2);font-weight:700}
.tscale>div{display:flex;gap:var(--s4);align-items:baseline;padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.tscale small{width:96px;flex:none;color:var(--ink2);font-size:14px}
.pubsw{background:#FFF4EA;border-radius:20px;padding:var(--s4);margin-top:var(--s4)}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;transform:none!important}
}

  EX.forEach(function(g){
    var pub=g[2]==='pub';
    h+='<section class="eg'+(pub?' pub':'')+'">'+(pub?'<div class="head"><h2>'+g[0]+'</h2><span class="opens">Opens public mode</span></div>':'<h2>'+g[0]+'</h2>')+'<div class="group">';
    g[1].forEach(function(r){h+='<a class="row ex" href="'+(r[2]||'#/explore')+'"><div><div class="nm">'+r[0]+'</div><div class="l2">'+r[1]+'</div></div>'+ic('chev')+'</a>';});
    h+='</div></section>';
  });
  h+='<section class="eg"><h2>For the build</h2><div class="group"><a class="row ex" href="#/parts"><div><div class="nm">Parts</div><div class="l2">Colours, type and parts of this look.</div></div>'+ic('chev')+'</a></div></section>';
  return h+'</div>';
}
function calendar(){
  var days=[['Mon','16',[]],['Tue','17',[]],['Wed','18',[['1:15 PM','HB 2121 E-cigarette tax','Senate Health and Human Services · room 225','HB2121']]],['Thu','19',[['2:00 PM','HB 1563 Flavored tobacco sales','House Health · room 329','HB1563']]],['Fri','20',[['10:00 AM','HB 890 Safe routes to school','House Finance · room 308','HB890']]]];
  var h='<div class="wrap"><h1 id="h1" tabindex="-1" style="margin-top:var(--s7)">Calendar</h1><p class="lede">Hearings this week, Mar 16 to 20.</p><div class="week">';
  days.forEach(function(d){
    h+='<div class="day'+(d[1]==='17'?' today':'')+'"><div class="datebox"><span class="dw">'+(d[1]==='17'?'Today':d[0])+'</span><span class="dn">'+d[1]+'</span></div><div class="hs" style="display:grid;gap:var(--s2)">';
    if(!d[2].length) h+='<p class="empty">No hearings</p>';
    d[2].forEach(function(e){h+='<a class="hear" href="#/bill/'+e[3]+'"><div><div class="tm">'+e[0]+'</div><div class="nm">'+e[1]+'</div><div class="pl">'+e[2]+'</div></div>'+ic('chev')+'</a>';});
    h+='</div></div>';
  });
  return h+'</div></div>';
}
function previewHTML(){
  var p=state.pub;
  if(!p.on) return '<div class="pubcard off"><div class="hd">HIPHI · Public site</div><div class="bd"><h3>Not shown</h3><p>This bill does not appear on the public site.</p></div></div>';
  return '<div class="pubcard"><div class="hd">HIPHI · Public site</div><div class="bd"><span class="tag">Bill to watch · HB 1563</span><h3>'+esc(p.name||'Short name')+'</h3><p>'+esc(p.what||'A few plain words about the bill.')+'</p><span class="ask">'+esc(p.ask||'The ask')+'</span><span class="until">Shows through '+esc(p.thru)+'</span></div></div>';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pub(){
  var p=state.pub;
  var opts=['Wed, Mar 18','Thu, Mar 19','Fri, Mar 20','Sat, Mar 21'].map(function(o){return '<option'+(o===p.thru?' selected':'')+'>'+o+'</option>';}).join('');
  return '<div class="pband"><div class="inner"><span class="tx">'+ic('globe')+'You are changing the public site</span><a class="btn btn-quiet" href="#/bill/HB1563" style="background:transparent">Leave public mode</a></div></div>'
  +'<div class="wrap wide"><div class="pgrid"><div><h1 id="h1" tabindex="-1">HB 1563 on the public site</h1><p class="lede">What you write here is what the public reads.</p>'
  +'<form id="pform" novalidate onsubmit="return false"><div class="field"><span class="lab" id="onl">Show on the public site</span><label class="switch"><input type="checkbox" id="f-on" role="switch" aria-labelledby="onl"'+(p.on?' checked':'')+'><span class="trk"></span><span id="onwords">'+(p.on?'On':'Off')+'</span></label></div>'
  +'<div class="field"><label for="f-name">Short name</label><input class="fld" id="f-name" value="'+esc(p.name)+'" autocomplete="off"><span class="errmsg" id="nameerr" hidden>'+ic('alert','sm')+'Add a short name so people know what this is.</span></div>'
  +'<div class="field"><label for="f-what">What it does, in plain words</label><textarea class="ta" id="f-what">'+esc(p.what)+'</textarea></div>'
  +'<div class="field"><label for="f-ask">The ask</label><input class="fld" id="f-ask" value="'+esc(p.ask)+'" autocomplete="off"></div>'
  +'<div class="field"><label for="f-thru">Shows through</label><select class="sel fld" id="f-thru">'+opts+'</select></div></form>'
  +'<div class="after"><p>Nate approves before the public sees it.</p><div class="actions" style="margin-top:0"><button class="btn btn-fill block" type="button" data-act="send-pub">Send to Nate to publish</button></div></div></div>'
  +'<aside class="preview" aria-labelledby="pvh"><div class="cap" id="pvh">'+ic('eye')+'What the public will see</div><div id="pv">'+previewHTML()+'</div></aside></div></div>';
}
function parts(){
  var sw=function(n,hex,use){return '<div class="sw"><i style="background:'+hex+'"></i><div><b>'+n+'</b>'+hex+'<br><span class="muted">'+use+'</span></div></div>';};
  var st=function(cls,lab,txt,extra){return '<div class="c"><span class="lab">'+lab+'</span><button class="btn '+cls+(extra||'')+'" type="button"'+(extra&&extra.indexOf('dis')>-1?' disabled':'')+'>'+txt+'</button></div>';};
  function trio(cls,txt){return st(cls,'Rest',txt)+st(cls,'Hover',txt,' is-hover')+st(cls,'Pressed',txt,' is-pressed')+st(cls,'Focus',txt,' is-focus')+'<div class="c"><span class="lab">Disabled</span><button class="btn '+cls+'" type="button" disabled>'+txt+'</button></div>'+'<div class="c"><span class="lab">Loading</span><button class="btn '+cls+' is-loading" type="button" aria-busy="true">Sending…</button></div>';}
  return '<div class="wrap wide pt"><h1 id="h1" tabindex="-1" style="margin-top:var(--s7)">Parts</h1><p class="lede">Look B, Lagoon. Every colour, size and part used in this sample.</p>'
  +'<h2>Colours</h2><div class="swatches">'
  +sw('Mist','#F1F6F8','Page')+sw('Surface','#FFFFFF','Cards and rows')+sw('Ink','#142B35','Text')+sw('Ink soft','#3F5662','Second text')+sw('Lagoon','#00698E','Action')+sw('Lagoon deep','#005674','Pressed')+sw('Tide','#E1F0F5','Tinted tile')+sw('Edge','#6F8B98','Control edges')
  +sw('Late','#B3261E','Late only')+sw('Due soon','#8A5A00','Due soon')+sw('Sent back','#7A2E6E','Sent back')+sw('Leaf','#2E7650','Done moment only')+'</div>'
  +'<div class="pubsw"><b style="color:#8A3410">Public mode colours</b><div class="swatches" style="margin-top:var(--s3)">'+sw('Apricot','#FFF4EA','Page')+sw('Sunset','#A8430F','Band and button')+sw('Terracotta','#8A3410','Headings')+sw('Cocoa','#3A1F12','Text')+'</div></div>'
  +'<h2>Type</h2><div class="demo tscale"><div><small>Display 38</small><span style="font:600 38px/1.15 Poppins;letter-spacing:-.02em">Good morning</span></div><div><small>Heading 28</small><span style="font:600 28px/1.25 Poppins;letter-spacing:-.02em">Write testimony</span></div><div><small>Heading 22</small><span style="font:600 22px/1.25 Poppins;letter-spacing:-.02em">Your steps</span></div><div><small>Name 18</small><span style="font:600 18px/1.3 Poppins">HB 1563 Flavored tobacco sales</span></div><div><small>Reading 16</small><span>Hearing Thu 2:00 PM, House Health</span></div><div><small>Small 14</small><span class="sm">Due Wed 2:00 PM, in 22 hours</span></div></div>'
  +'<h2>Buttons</h2><h3>Filled</h3><div class="demo states">'+trio('btn-fill','Send for approval')+'</div><h3>Quiet</h3><div class="demo states">'+trio('btn-quiet','Write testimony')+'</div><h3>Text</h3><div class="demo states">'+trio('btn-text','Back to Home')+'</div>'
  +'<h2>A row</h2><div class="group">'+billRow(BILLS[1],false)+'</div>'
  +'<h2>A step</h2><div class="group">'+stepCard('write')+stepCard('resubmit')+'</div>'
  +'<h2>Status marks</h2><div class="demo" style="display:flex;flex-wrap:wrap;gap:var(--s4) var(--s5)">'+mark('ontime','On time')+mark('soon','Due soon')+mark('late','Late')+mark('back','Sent back')+mark('done','Done')+'</div>'
  +'<h2>A field with an error</h2><div class="demo"><div class="field" style="margin-top:0"><label for="pe">Short name</label><input class="fld err" id="pe" aria-describedby="pe-m" aria-invalid="true"><span class="errmsg" id="pe-m">'+ic('alert','sm')+'Add a short name so people know what this is.</span></div></div>'
  +'<h2>A note</h2><div class="note"><span class="av">KR</span><div class="bd"><div class="who">Kris · Mon, Mar 16</div><div>Please keep it to one page.</div></div></div>'
  +'<h2>A toast with Undo</h2><div class="toast" style="animation:none;position:static;display:inline-flex"><span>Sent to Kris.</span><button class="btn btn-text" type="button">Undo</button></div></div>';
}

/* router */
var TITLES={'':'Home',calm:'Home',calendar:'Calendar',explore:'Explore',parts:'Parts',done:'Done',public:'Public mode',bill:'Bill',do:'Step'};
function render(){
  clearInterval(timer);
  var raw=location.hash.replace(/^#\/?/,''), seg=raw.split('/'), r=seg[0], a=seg[1], h;
  var cur={'':'home',calm:'home',bill:'home',calendar:'calendar',explore:'explore',parts:'explore'}[r];
  document.documentElement.dataset.mode=r==='public'?'public':'tracker';
  document.body.dataset.bars=(r==='do'||r==='done'||r==='public')?'off':'on';
  bars(cur);
  if(r==='calm') h=home(true); else if(r==='do') h=stepPage(a); else if(r==='done') h=donePage(); else if(r==='bill') h=billPage(a);
  else if(r==='explore') h=explore(); else if(r==='calendar') h=calendar(); else if(r==='public') h=pub(); else if(r==='parts') h=parts(); else h=home(false);
  app.className='';void app.offsetWidth;app.className='page';
  app.innerHTML=h;
  document.title=(TITLES[r]||'Home')+' · Bill tracker, Look B';
  window.scrollTo(0,0);
  var h1=$('#h1'); if(h1&&r!=='') h1.focus({preventScroll:true});
  if(r==='done'){var n=10;timer=setInterval(function(){n--;var c=$('#count');if(!c){clearInterval(timer);return;}if(n<=0){clearInterval(timer);var u=$('#undo');if(u)u.hidden=true;}else c.textContent=n+' seconds';},1000);}
}
function toast(msg,undo){
  var t=document.createElement('div');t.className='toast';
  t.innerHTML='<span>'+msg+'</span><button class="btn btn-text" type="button">Undo</button>';
  $('#toasts').appendChild(t);
  var kill=function(){if(t.parentNode)t.parentNode.removeChild(t);};
  t.querySelector('button').onclick=function(){kill();if(undo)undo();};
  setTimeout(kill,10000);
}
var lastFocus=null;
function openSearch(){
  lastFocus=document.activeElement;
  var R=[['HB 1563 Flavored tobacco sales','Bill','#/bill/HB1563'],['HB 2121 E-cigarette tax','Bill','#/bill/HB2121'],['Tobacco and e-cigarettes','Issue','#/explore'],['Calendar','Place','#/calendar']];
  $('#results').innerHTML=R.map(function(x){return '<li><a href="'+x[2]+'" data-act="search-close"><span class="nm">'+x[0]+'</span><span class="k">'+x[1]+'</span></a></li>';}).join('');
  $('#search').classList.add('open');$('#q').value='';$('#q').focus();
}
function closeSearch(){$('#search').classList.remove('open');if(lastFocus&&lastFocus.focus)lastFocus.focus();}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-go]');
  if(e.target.id==='search'){closeSearch();return;}
  if(!t) return;
  var act=t.getAttribute('data-act');
  if(t.getAttribute('data-go')){location.hash=t.getAttribute('data-go');return;}
  if(act==='search-open') openSearch();
  else if(act==='search-close'){ $('#search').classList.remove('open'); }
  else if(act==='send'){
    var k=t.getAttribute('data-k'); t.classList.add('is-loading'); t.setAttribute('aria-busy','true'); t.textContent=k==='ask'?'Opening…':'Sending…';
    setTimeout(function(){state.done=k;location.hash='#/done';},450);
  }
  else if(act==='undo-done'){location.hash='#/do/'+state.done;}
  else if(act==='send-pub'){
    if(state.pub.on&&!state.pub.name.trim()){var er=$('#nameerr');er.hidden=false;$('#f-name').classList.add('err');$('#f-name').focus();return;}
    toast('Sent to Nate. The public site has not changed yet.');
  }
});
document.addEventListener('input',function(e){
  var id=e.target.id, p=state.pub;
  if(id==='letter'){state.letter[e.target.getAttribute('data-k')]=e.target.value;return;}
  if(e.target.name==='pos'){state.pos=e.target.value;return;}
  if(id.indexOf('f-')!==0) return;
  if(id==='f-on'){p.on=e.target.checked;$('#onwords').textContent=p.on?'On':'Off';}
  if(id==='f-name'){p.name=e.target.value;var bad=!p.name.trim();$('#nameerr').hidden=!bad;e.target.classList.toggle('err',bad);}
  if(id==='f-what')p.what=e.target.value;
  if(id==='f-ask')p.ask=e.target.value;
  if(id==='f-thru')p.thru=e.target.value;
  $('#pv').innerHTML=previewHTML();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#search').classList.contains('open')) closeSearch();
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&document.body.dataset.bars==='on'){e.preventDefault();openSearch();}
});
window.addEventListener('hashchange',render);
render();
})();
</script>
</body>
