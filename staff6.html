<!-- Drawn by the page itself, before any script arrives: on a slow Capitol connection the 30-odd module files take
     seconds, and an empty page reads as broken. If the code never arrives, this becomes "Try again". -->
<style>
/* v6 (R-336): the first thing anyone sees is in their own palette too (tokens.css, palettes.css; fallbacks are HIPHI Family). */
.boot0 { min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: var(--v6-page, #F4F7F9); font-family: Lato, system-ui, sans-serif; color: var(--v6-body, #344852); }
.boot0 .bar { width: 100%; max-width: 440px; box-sizing: border-box; padding: 10vh 16px 0; display: flex; align-items: center; gap: 12px; margin: 0; }
.boot0 .bar .mk { width: 48px; height: 48px; flex: none; }
.boot0 .bar > span { display: flex; flex-direction: column; }
.boot0 .bar b { font: 600 18px/1.25 Poppins, system-ui, sans-serif; color: var(--v6-ink, #142B35); }
.boot0 .bar .for { font-size: 14px; line-height: 20px; color: var(--v6-muted, #5B6B71); }
.boot0 .msg { padding: 16px 16px 32px; max-width: 440px; width: 100%; box-sizing: border-box; }
body .boot0 main.msg { margin: 0 auto; }   /* the failure's <main>: centred like the brand line, whatever staff.css says of main */
.boot0 h1 { font: 700 28px/34px Poppins, system-ui, sans-serif; color: var(--v6-ink, #142B35); margin: 0 0 8px; }
.boot0 p { margin: 0 0 16px; font-size: 16px; line-height: 24px; }
.boot0 button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--v6-action, #00698E); color: #fff; font: 700 16px Lato, system-ui, sans-serif; cursor: pointer; }
.boot0 button:hover { background: var(--v6-action-press, #005674); }
.boot0 button:focus-visible { outline: 3px solid var(--v6-action, #00698E); outline-offset: 2px; }
</style>

window.__bootT = setTimeout(bootFail, 20000);
</script>
