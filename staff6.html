<!-- Drawn by the page itself, before any script arrives: on a slow Capitol connection the 30-odd module files take
     seconds, and an empty page reads as broken. If the code never arrives, this becomes "Try again". -->
<style>
/* v6 (R-336): the first thing anyone sees is in the warm look too (spec 4): sand ground, ink words, the teal button. */
.boot0 { min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: #F7F3EA; font-family: Lato, system-ui, sans-serif; color: #433B33; }
.boot0 .bar { width: 100%; max-width: 440px; box-sizing: border-box; padding: 10vh 16px 0; font: 600 18px/1.25 Poppins, system-ui, sans-serif; color: #25221E; }
.boot0 .msg { padding: 16px 16px 32px; max-width: 440px; width: 100%; box-sizing: border-box; }
.boot0 h1 { font: 700 28px/34px Poppins, system-ui, sans-serif; color: #25221E; margin: 0 0 8px; }
.boot0 p { margin: 0 0 16px; font-size: 16px; line-height: 24px; }
.boot0 button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #0B6E73; color: #fff; font: 700 16px Lato, system-ui, sans-serif; cursor: pointer; }
.boot0 button:hover { background: #095A5E; }
.boot0 button:focus-visible { outline: 3px solid #0B6E73; outline-offset: 2px; }
</style>
<div id="app"><div class="boot0" role="status"><div class="bar">Bill Tracker</div><div class="msg"><p>Getting your day ready…</p></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
function bootFail() { var a = document.getElementById('app'); if (!a || !a.querySelector('.boot0 [role], .boot0')) return; if (a.querySelector('.boot0')) a.innerHTML = '<div class="boot0"><div class="bar">Bill Tracker</div><main class="msg"><h1>We could not load the tracker</h1><p>Check your connection and try again.</p><button type="button" onclick="location.reload()">Try again</button></main></div>'; }
window.__bootT = setTimeout(bootFail, 20000);
</script>
<script type="module" src="staff6/app.js" onerror="bootFail()"></script>
