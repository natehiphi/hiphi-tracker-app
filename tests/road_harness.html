<!doctype html>
<!-- Standalone proof page for pub/v2/road.js (R-357 phase 1): no app, a fake bill. tests/road_harness.py drives it.
     ?bill=sb|hb picks the example; the buttons stand in for the host's Next / Back. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road harness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="../pub/base.css"><link rel="stylesheet" href="../pub/lessons.css">
<style>body{margin:0}.host{padding:12px 16px 90px;display:grid;gap:12px}.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;padding:10px 16px;background:#fff;border-top:1px solid #DBE3E7}.bar button{min-height:44px;padding:0 18px;font:700 16px Lato}</style></head>
<body><div class="host" id="host"></div>
<div class="bar"><button id="back">Back</button><button id="next" data-stnext>Next</button><span id="pg"></span></div>
<script type="module">
import { S } from '../pub/core.js';
const road = await import('../pub/v2/road.js');
const q = new URLSearchParams(location.search), which = q.get('bill') || 'sb';
S.committees = { HLT: { chamber: 'H', name: 'Health' }, FIN: { chamber: 'H', name: 'Finance' } };
const sb = { id: 'b1', bill_number: 'SB 2175', hiphi_position: 'strongly_support', hiphi_summary: 'Bans the sale of disposable e-cigarettes in Hawaiʻi.' };
const hb = { id: 'b2', bill_number: 'HB 1450', hiphi_position: 'support_amend', hiphi_summary: 'Establishes a statewide program to fund school health aides and training.' };
const E = which === 'sb' ? { b: sb, id: 'b1', num: 'SB 2175', name: 'Disposable e-cigarette ban', start: 'Senate', other: 'House', x: { ballot: false, st: { committee: 'HLT' } }, off: false }
  : { b: hb, id: 'b2', num: 'HB 1450', name: 'School health aides', start: 'House', other: 'Senate', x: { ballot: false, st: {} }, off: false };
const o = which === 'sb' ? { soft: false, example: false, issue: { id: 'i1', name: 'Disposable e-cigarette ban', slug: 'disposable-e-cigarette-ban', category: 'tobacco' }, mine: true, at: 2 }
  : { soft: true, example: true, issue: { id: 'i2', name: 'Healthy kids in school', slug: 'x', category: 'children' }, mine: false, at: 0 };
const place = () => { const h = road.teachHTML(E, o); document.getElementById('host').innerHTML = h.pic + h.main; };
window.H = { road, E, o, place, start: opts => { place(); road.teachStart(E, o, { onPage: k => { document.getElementById('pg').textContent = k; }, onPick: (s, c) => { window.picked = [s, c]; }, ...opts }); },
  plan: instant => { document.getElementById('host').innerHTML = road.planPic(E, o); road.planStart({ instant }); }, ready: true };
document.getElementById('next').onclick = () => road.teachNext();
document.getElementById('back').onclick = () => road.teachPrev();
</script></body></html>
