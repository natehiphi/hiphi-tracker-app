<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIPHI bill tracker</title>
<!--
  Embeddable public table: the bills HIPHI has a position on, our position,
  and where each one stands. Reads the same public view as track.html
  (public_bills) with the publishable key; nothing internal is reachable.

    embed.html                      every bill with a public position
    embed.html?coalition=ctfh       one coalition (slug from Settings → Coalitions)
    embed.html?limit=15             shorter list with a "see all" link
    embed.html?positions=all        include bills we only monitor
    embed.html?list=keiki-health    one curated list (slug from More → Lists)
    embed.html?demo=1               sandbox data (March 16, 2026)

  The page posts its height to the parent so the iframe can size itself.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0C2233;--muted:#5B7180;--line:#DDE6EB;--teal:#0E7C86;--red:#BE4038;--gold:#9A6A0C;--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font:14px/1.45 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);padding:2px}
.head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.head h2{font-size:16px;margin:0;font-weight:700}
.head .sub{font-size:12.5px;color:var(--muted)}
.head input{flex:0 1 220px;min-width:140px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px}
.wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:#F7FAFB}
td{padding:11px 12px;border-bottom:1px solid #EEF2F5;vertical-align:top}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:#F7FAFB}
.num{font-weight:700;white-space:nowrap;color:var(--teal);text-decoration:none}
.t{font-weight:500}
.s{font-size:12.5px;color:var(--muted);margin-top:2px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.s1{background:#1E7A4C;color:#fff}.chip.s2{background:#DFF1E6;color:#1E6B43}
.chip.o1{background:var(--red);color:#fff}.chip.o2{background:#FAE6E4;color:#9C2F28}
.chip.n{background:#FBF0D9;color:var(--gold)}.chip.m{box-shadow:inset 0 0 0 1.5px #9DB0BA;color:var(--muted)}
.st{font-size:13px;white-space:nowrap}
.st.dead{color:var(--muted)}.st.law{color:#1E7A4C;font-weight:600}
.act{display:inline-block;margin-top:5px;font-size:12px;font-weight:600;color:var(--red)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:9px;font-size:12.5px;color:var(--muted)}
.foot a{color:var(--teal);font-weight:600;text-decoration:none}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}
@media (max-width:560px){
  thead{display:none}
  tr.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 12px;border-bottom:1px solid #EEF2F5}
  tr.row:last-child{border-bottom:0}
  td{padding:0;border:0}
  td.c-bill{grid-column:1/-1}
  td.c-st{justify-self:end}
}
</style>
</head>
<body>
<div class="head"><div><h2 id="title">Bills we are working on</h2><div class="sub" id="sub"></div></div><input type="search" id="q" placeholder="Search bills…" aria-label="Search bills" hidden></div>
<div class="wrap"><table><thead><tr><th>Bill</th><th>Our position</th><th>Where it stands</th></tr></thead><tbody id="rows"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody></table></div>
<div class="foot"><span id="count"></span><a id="all" target="_blank" rel="noopener">See every bill and take action ›</a></div>
<script type="module">
const SUPABASE_URL = 'https://eivzjbnygscguqqiiuvh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_uvEtw8ru3zB9lDOxAjzrUA_JEFvKyul';
const P = new URLSearchParams(location.search);
const DEMO = P.has('demo'), COAL = (P.get('coalition') || '').toLowerCase(), LIST = (P.get('list') || '').toLowerCase(), LIMIT = Math.max(1, Math.min(500, Number(P.get('limit')) || 50)), ALLPOS = P.get('positions') === 'all';
const TRACK = new URL('track.html' + (DEMO ? '?demo=1' : ''), location.href).href;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const POS = { strongly_support: ['Strongly support', 's1', 0], strongly_oppose: ['Strongly oppose', 'o1', 1], support: ['Support', 's2', 2], support_amend: ['Support with amendments', 's2', 2],
  oppose: ['Oppose', 'o2', 3], neutral: ['Comments', 'n', 4], monitor: ['Monitoring', 'm', 5] };
const ORDER = ['introduced', 'first_triple', 'first_lateral', 'first_decking', 'first_crossover', 'second_triple', 'second_lateral', 'second_decking', 'second_crossover', 'conference', 'governor', 'enacted'];
// Plain words for where a bill stands; the chamber names come from the bill number.
function where(b) {
  const first = /^H/.test(b.bill_number) ? 'House' : 'Senate', other = first === 'House' ? 'Senate' : 'House', s = b.stage;
  if (s === 'dead') return ['Did not advance this year', 'dead'];
  if (s === 'vetoed') return ['Vetoed', 'dead'];
  if (s === 'enacted') return ['Became law', 'law'];
  if (s === 'governor') return ['On the Governor’s desk', ''];
  if (s === 'conference') return ['House and Senate negotiating', ''];
  if (s === 'second_crossover') return ['Passed both chambers', ''];
  if (/^second_/.test(s)) return [`In ${other} committees`, ''];
  if (s === 'first_crossover') return [`Passed the ${first}, now in the ${other}`, ''];
  if (s === 'introduced') return ['Introduced, waiting for a hearing', ''];
  return [`In ${first} committees`, ''];
}
let LISTINFO = null;
async function load() {
  if (DEMO) {
    const snap = await (await fetch('demo/snapshot.json', { cache: 'force-cache' })).json();
    if (LIST) { const l = snap.lists.find(x => x.slug === LIST); if (!l) throw new Error('No such list.'); LISTINFO = l;
      const rows = snap.listBills.filter(x => x.list_id === l.id).sort((a, b) => a.sort_order - b.sort_order);
      return rows.map(r => ({ ...snap.bills.find(b => b.id === r.bill_id), list_note: r.note, list_order: r.sort_order })).filter(b => b.id); }
    const camp = Object.fromEntries(snap.campaigns.map(c => [c.id, c])), of = {};
    for (const r of snap.billCampaigns) { const c = camp[r.campaign_id]; if (c?.is_public) (of[r.bill_id] ??= []).push(c); }
    return snap.bills.flatMap(b => (of[b.id] || [{}]).map(c => ({ ...b, campaign: c.public_name || c.name || null, campaign_slug: c.slug || null })));
  }
  const H = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, Range: '0-1999' };
  const q = new URLSearchParams({ select: 'bill_number,title,public_summary,stage,position,public_action,public_action_until,campaign,campaign_slug', order: 'bill_number' });
  if (COAL) q.set('campaign_slug', 'eq.' + COAL);
  if (LIST) {
    const li = await (await fetch(`${SUPABASE_URL}/rest/v1/public_lists_v?slug=eq.${encodeURIComponent(LIST)}&select=*`, { headers: H })).json();
    if (!li[0]) throw new Error('This list is not published.'); LISTINFO = li[0];
    const lb = await (await fetch(`${SUPABASE_URL}/rest/v1/public_list_bills_v?slug=eq.${encodeURIComponent(LIST)}&select=bill_number,note,sort_order`, { headers: H })).json();
    const nums = lb.map(x => x.bill_number); if (!nums.length) return [];
    q.set('bill_number', `in.(${nums.map(n => '"' + n + '"').join(',')})`);
    const r = await fetch(`${SUPABASE_URL}/rest/v1/public_bills?${q}`, { headers: H }); if (!r.ok) throw new Error('Could not load the bills.');
    return (await r.json()).map(b => { const x = lb.find(y => y.bill_number === b.bill_number); return { ...b, list_note: x?.note, list_order: x?.sort_order ?? 999 }; });
  }
  const r = await fetch(`${SUPABASE_URL}/rest/v1/public_bills?${q}`, { headers: H });
  if (!r.ok) throw new Error('Could not load the bills.');
  return r.json();
}
const nice = t => t === t.toUpperCase() ? t.charAt(0) + t.slice(1).toLowerCase().replace(/\bhawaii\b/g, 'Hawaii') : t;   // the Capitol's ALL-CAPS titles
let ALL = [];
function draw() {
  const q = (document.getElementById('q').value || '').toLowerCase().trim();
  const list = ALL.filter(b => !q || (b.bill_number + ' ' + (b.title || '') + ' ' + (b.public_summary || '')).toLowerCase().includes(q));
  const shown = list.slice(0, LIMIT);
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Pacific/Honolulu' });
  document.getElementById('rows').innerHTML = shown.length ? shown.map(b => { const [pl, pc] = POS[b.position] || POS.monitor, [wt, wc] = where(b);
    const ask = b.public_action && (DEMO || (b.public_action_until && b.public_action_until >= today));
    return `<tr class="row" data-num="${esc(b.bill_number)}"><td class="c-bill"><a class="num" href="${TRACK}#bill=${esc(b.bill_number)}" target="_blank" rel="noopener">${esc(b.bill_number.replace(/^(\D+)/, '$1 '))}</a>
      <div class="t">${esc(nice(b.public_summary || b.title || '').slice(0, 170))}</div>${b.list_note ? `<div class="s"><i>${esc(b.list_note)}</i></div>` : ''}${ask ? `<span class="act">Take action ›</span>` : ''}</td>
      <td class="c-pos"><span class="chip ${pc}">${pl}</span></td><td class="c-st"><span class="st ${wc}">${esc(wt)}</span></td></tr>`; }).join('')
    : `<tr><td colspan="3" class="empty">${q ? 'No bills match that search.' : 'No bills to show yet. Check back when the session opens.'}</td></tr>`;
  document.getElementById('count').textContent = list.length > shown.length ? `Showing ${shown.length} of ${list.length} bills` : `${list.length} bill${list.length === 1 ? '' : 's'}`;
  document.querySelectorAll('tr.row').forEach(tr => tr.onclick = e => { if (e.target.closest('a')) return; window.open(`${TRACK}#bill=${tr.dataset.num}`, '_blank', 'noopener'); });
  tellHeight();
}
const tellHeight = () => parent !== window && parent.postMessage({ hiphiTrackerHeight: document.documentElement.scrollHeight }, '*');
addEventListener('resize', tellHeight);
(async () => {
  document.getElementById('all').href = TRACK;
  try {
    let rows = await load();
    if (COAL) rows = rows.filter(b => (b.campaign_slug || '').toLowerCase() === COAL);
    if (!ALLPOS) rows = rows.filter(b => b.position && b.position !== 'monitor');
    const seen = new Set(); rows = rows.filter(b => !seen.has(b.bill_number) && seen.add(b.bill_number));   // a bill in two coalitions shows once
    const alive = b => !['dead', 'vetoed'].includes(b.stage);
    if (LIST) rows.sort((a, b) => a.list_order - b.list_order); else
    rows.sort((a, b) => alive(b) - alive(a) || (POS[a.position] || POS.monitor)[2] - (POS[b.position] || POS.monitor)[2] || ORDER.indexOf(b.stage) - ORDER.indexOf(a.stage) || a.bill_number.localeCompare(b.bill_number, 'en', { numeric: true }));
    ALL = rows;
    const name = COAL && rows[0]?.campaign; if (name) document.getElementById('title').textContent = `${name}: bills we are working on`;
    if (LISTINFO) { document.getElementById('title').textContent = `${LISTINFO.icon ? LISTINFO.icon + ' ' : ''}${LISTINFO.title}`; document.getElementById('all').href = TRACK + '#list=' + LIST; document.getElementById('all').textContent = 'Follow this list on the HIPHI tracker ›'; }
    document.getElementById('sub').textContent = LISTINFO ? (LISTINFO.description || 'Curated by the Hawaiʻi Public Health Institute') : 'Hawaiʻi Public Health Institute · positions and status update through the day';
    const q = document.getElementById('q'); if (rows.length > 10) { q.hidden = false; q.oninput = draw; }
    draw();
  } catch (e) { document.getElementById('rows').innerHTML = `<tr><td colspan="3" class="empty">${esc(e.message)}</td></tr>`; tellHeight(); }
})();
</script>
</body>
</html>
