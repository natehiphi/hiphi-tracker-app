<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex">
<title>This test has ended · HIPHI Bill Tracker</title>
<link rel="icon" href="pub/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<!-- Where an ended tester link lands (R-204, Nate 10/7: "It should not allow anybody to access the app at all"). track.html
     sends a link listed in its ENDED here before any of the app loads. On purpose there is no link into the tracker: an
     accepted exception to DESIGN B-3 (no dead ends), recorded in docs/DESIGN-AUDIT.md. The tracker's own colours and type,
     as text-terms.html. -->
<style>
  :root { --p700: #00698E; --n0: #FFFFFF; --n50: #F4F7F9; --n200: #DBE3E7; --n500: #5F6F76; --n900: #142B35;
          --font-h: 'Poppins', 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif; --font: 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--n50); color: var(--n900); font: 400 1.125rem/1.6 var(--font); }
  header { background: var(--n0); border-bottom: 1px solid var(--n200); }
  header p { display: flex; align-items: center; gap: 8px; margin: 0; padding: 14px 16px; font: 700 1rem var(--font-h); }
  header img { width: 28px; height: 28px; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--n0); border: 1px solid var(--n200); border-radius: 16px; padding: 28px 24px; }
  h1 { font: 700 1.75rem/1.2 var(--font-h); margin: 0 0 12px; }
  p { margin: 0 0 8px; }
  a { color: var(--p700); }
  .small { color: var(--n500); font-size: 1rem; margin-top: 20px; }
</style>
</head><body>
<header><p><img src="pub/icon.svg" alt="">HIPHI Bill Tracker</p></header>
<main>
  <div class="card">
    <h1>This test has ended</h1>
    <p>Mahalo for helping us test the HIPHI Bill Tracker. This link no longer opens it.</p>
    <p>You can close this page.</p>
    <p class="small">Questions? Email <a href="mailto:contact@hiphi.org">contact@hiphi.org</a>.</p>
  </div>
</main>
</body></html>
