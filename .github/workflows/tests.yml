# Tests on every push (R-111, the assessment's U1). A public repository's GitHub Actions minutes are free, so this costs
# nothing against the private Bill-Tracker repository's 2,000 a month (R-104). It fails the push when a screen breaks:
# the module-aware syntax check of every JS file, the two staff apps' data-call parity, the suggested-bill rules, and
# three Playwright runs against this commit served locally: every public screen as three kinds of person in the sandbox
# and on live data (screens_smoke.py), year-proof bill links (year_links.py) and the error reporter (errlog.py); then Staff v2's
# live path on a fake database (staff_live.py) and its flows in the sandbox (staff_flows.py, R-152). The live
# half reads production as the public does, with the privacy signal set, so no visit is counted. A red run emails whoever
# pushed. The share-pages commits (b/, i/ and cal/ only; hourly from January to June) do not run it.
name: Tests
on:
  push:
    paths-ignore:
      - 'b/**'
      - 'i/**'
      - 'cal/**'
      - 'pub/og/**'
      - 'tools/og_wanted.json'
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax of every JS file (module-aware)
        run: |
          bad=0
          for f in $(git ls-files '*.js' '*.mjs'); do
            node --input-type=module --check < "$f" || { echo "SYNTAX ERROR in $f"; bad=1; }
          done
          exit $bad
      - name: The two staff apps make the same data calls
        run: node staff/tools/parity.mjs
      - name: The public page's first load carries the kernel only (R-122)
        run: node tools/check_split.mjs
      - name: The suggested bill's rules
        run: node tests/rank_test.mjs
      - name: HIPHI's words ("e-cigarettes", never "vapes", R-158)
        run: node tests/words_test.mjs
      - name: The share cards lead with the ask and open it (R-169)
        run: node tests/share_cards_test.mjs
      - name: Playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Serve this commit
        run: |
          python3 -m http.server 8832 > /dev/null 2>&1 &
          sleep 1
      - name: Every public screen, three kinds of person, sandbox and live
        run: python3 tests/screens_smoke.py
      - name: Year-proof bill links
        run: python3 tests/year_links.py
      - name: The error reporter
        run: python3 tests/errlog.py
      - name: Staff v2 on a fake database (R-152): reads, a failed read, refresh, saves, two sessions' bill numbers, error reports
        run: python3 tests/staff_live.py
      - name: Staff v2's flows in the sandbox (R-152)
        run: python3 tests/staff_flows.py
      - name: Staff v2, batch C: countdowns, the Public tab, the week's asks (R-152)
        run: python3 tests/staff_r152c.py
      - name: Staff v2, batch D: the practice copy, readiness, small fixes (R-152)
        run: python3 tests/staff_r152d.py
      - name: Staff v2, Today | Ahead (R-049)
        run: python3 tests/staff_ahead.py
      - name: Staff v2, a bill the team does not track (R-058)
        run: python3 tests/staff_untracked.py
      - name: Staff v2, the note on an issue when a bill goes against its stance (R-095)
        run: python3 tests/staff_issue_note.py
