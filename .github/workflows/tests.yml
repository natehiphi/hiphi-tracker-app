# Tests on every push (R-111, the assessment's U1). A public repository's GitHub Actions minutes are free, so this costs
# nothing against the private Bill-Tracker repository's 2,000 a month (R-104). It fails the push when a screen breaks:
# the module-aware syntax check of every JS file, the two staff apps' data-call parity, the suggested-bill rules, and
# three Playwright runs against this commit served locally: every public screen as three kinds of person in the sandbox
# and on live data (screens_smoke.py), year-proof bill links (year_links.py) and the error reporter (errlog.py); then Staff v2's
# live path on a fake database (staff_live.py) and its flows in the sandbox (staff_flows.py, R-152). The live
# half reads production as the public does, with the privacy signal set, so no visit is counted. A red run emails whoever
# pushed. Since R-278 every step runs even after one fails (the run is still red), so one run lists every stale check. The
# share-pages commits (b/, i/ and cal/ only; hourly from January to June) do not run it.
name: Tests
on:
  push:
    paths-ignore:
      - 'b/**'
      - 'i/**'
      - 'cal/**'
      - 'pub/og/**'
      - 'tools/og_wanted.json'
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  # A run in progress finishes and only the newest push waits behind it: with builds pushing every ~10 minutes and a
  # ~20-minute run, cancelling meant no run ever finished on 10/11 (R-240).
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 20 stopped the run in its last step on 10/11 (R-240); a green run takes ~27 minutes, and since R-278 a red
                          # one runs every step too, where a failing browser test waits out its timeouts (minutes are free here)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The eight steps that need no browser are one list, tools/quick_checks.mjs, which also runs before every push from
      # Nate's machine (backend/.githooks/pre-push, R-278); it runs them all and names every one that fails.
      - name: "The quick checks: syntax, the staff apps' parity, the first load, the suggested bill, HIPHI's words, share cards, the quiz, the words list"
        run: node tools/quick_checks.mjs
      - name: Playwright
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Serve this commit
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8832 > /dev/null 2>&1 &
          sleep 1
      - name: Every public screen, three kinds of person, sandbox and live
        if: ${{ !cancelled() }}
        run: python3 tests/screens_smoke.py
      - name: "Staff v3 on a laptop (R-264, DESIGN A-24): one side panel, at most 5 things, 7 colours, 1 filled button in view"
        if: ${{ !cancelled() }}
        run: python3 tests/staff3_budget.py
      - name: "Staff v4 on a laptop (R-269, DESIGN A-24): the same budget"
        if: ${{ !cancelled() }}
        run: python3 tests/staff4_budget.py
      - name: "Staff v4: each person's three things where R-269 put them (Nate's targets, 12 Oct)"
        if: ${{ !cancelled() }}
        run: python3 tests/staff4_people.py
      - name: "Staff v5 on a laptop (R-277, DESIGN A-24): the same budget"
        if: ${{ !cancelled() }}
        run: python3 tests/staff5_budget.py
      - name: "Staff v5: each person's three things (as v4's)"
        if: ${{ !cancelled() }}
        run: python3 tests/staff5_people.py
      - name: "Staff v5: no hearing ask on a bill HIPHI opposes (R-316 W2)"
        if: ${{ !cancelled() }}
        run: python3 tests/staff5_oppose.py
      - name: "Staff v5: turning someone off never hides their work (R-316 W28)"
        if: ${{ !cancelled() }}
        run: python3 tests/staff5_turnoff.py
      - name: "Staff v5: Help answers everyday questions; search finds coalitions (R-316 W29)"
        if: ${{ !cancelled() }}
        run: python3 tests/staff5_help_search.py
      - name: "Staff v5: no label spills out of its card at 1280 and 1440 (R-316 W54)"
        if: ${{ !cancelled() }}
        run: python3 tests/staff5_overflow.py
      - name: "Staff v5: My issues and Bills give the same testimony step and due time (R-316 W23)"
        if: ${{ !cancelled() }}
        run: python3 tests/staff5_step_match.py
      - name: Year-proof bill links
        if: ${{ !cancelled() }}
        run: python3 tests/year_links.py
      - name: The error reporter
        if: ${{ !cancelled() }}
        run: python3 tests/errlog.py
      - name: "Staff v2 on a fake database (R-152): reads, a failed read, refresh, saves, two sessions' bill numbers, error reports"
        if: ${{ !cancelled() }}
        run: python3 tests/staff_live.py
      - name: Staff v2's flows in the sandbox (R-152)
        if: ${{ !cancelled() }}
        run: python3 tests/staff_flows.py
      - name: "Staff v2, batch C: countdowns, the Public tab, the week's asks (R-152)"
        if: ${{ !cancelled() }}
        run: python3 tests/staff_r152c.py
      - name: "Staff v2, batch D: the practice copy, readiness, small fixes (R-152)"
        if: ${{ !cancelled() }}
        run: python3 tests/staff_r152d.py
      - name: Staff v2, Today | Ahead (R-049)
        if: ${{ !cancelled() }}
        run: python3 tests/staff_ahead.py
      - name: Staff v2, a bill the team does not track (R-058)
        if: ${{ !cancelled() }}
        run: python3 tests/staff_untracked.py
      - name: Staff v2, the note on an issue when a bill goes against its stance (R-095)
        if: ${{ !cancelled() }}
        run: python3 tests/staff_issue_note.py
      - name: A stop asked for by number, from any browser (D1-3, R-180)
        if: ${{ !cancelled() }}
        run: python3 tests/stop_number.py
      - name: The plans' sign-up keeps the promise beside the button, and promises no reminder (D1-6, D1-1)
        if: ${{ !cancelled() }}
        run: python3 tests/plans_join.py
      - name: Staff v2, Session setup > Privacy and keeping (J2-1, J2-2)
        if: ${{ !cancelled() }}
        run: python3 tests/staff_privacy.py
      - name: The privacy page, whole and short (J2-3)
        if: ${{ !cancelled() }}
        run: python3 tests/privacy_page.py
      - name: The unsubscribe page changes nothing until its button is pressed (X1-7)
        if: ${{ !cancelled() }}
        run: python3 tests/unsubscribe_page.py
      - name: A stopped bill whose same idea became law says so (X4-4)
        if: ${{ !cancelled() }}
        run: python3 tests/same_idea_law.py
      - name: "What kind of advocate are you? In the practice copy, and not outside it (R-217, a draft)"
        if: ${{ !cancelled() }}
        run: python3 tests/quiz.py
      - name: The words list for the checker panel is current (R-166 step 3)
        if: ${{ !cancelled() }}
        run: node tools/words_extract.mjs --check
      - name: "The tracker in other languages: the machinery, with a made-up language (R-166 step 3)"
        if: ${{ !cancelled() }}
        run: python3 tests/i18n.py
      - name: "Staff v2, R-180 wave 3: new hearings, the rallying path, saves that say what they did (X10-3, X10-5, X10-6)"
        if: ${{ !cancelled() }}
        run: python3 tests/staff_x10.py
      - name: "The step tests: thirteen journeys within budget and working (X10-7)"
        if: ${{ !cancelled() }}
        run: python3 tests/journeys.py
      - name: Session setup shows the dated steps as expected, and Sort new bills puts a hearing first (Z1-6)
        if: ${{ !cancelled() }}
        run: python3 tests/setup_expected.py
      - name: Home's first card counts the day's deadlines, and twin bills are one card (R-131, R-244)
        if: ${{ !cancelled() }}
        run: python3 tests/home_now.py
      - name: The public page's words on a phone and a laptop, testimony to sharing (R-199 wave 1, R-244)
        if: ${{ !cancelled() }}
        run: python3 tests/r199_words.py
      - name: "The story kept when written: with no profile, a letter's reason stays on the device for the next letter (R-212 #26)"
        if: ${{ !cancelled() }}
        run: python3 tests/story_kept.py
      - name: "Your letters: the session page's day, stance and Your letter / Your email, the profile's list, a letter whose hearing is gone (R-212 #27)"
        if: ${{ !cancelled() }}
        run: python3 tests/my_letters.py
      - name: "Delete buttons: a story, a letter and a phone-only profile, each with Undo or a question on the page (R-212 #28)"
        if: ${{ !cancelled() }}
        run: python3 tests/delete_buttons.py
      - name: "Next after a letter: the soonest other open testimony on what you follow, with Write on (R-212 #29)"
        if: ${{ !cancelled() }}
        run: python3 tests/next_up.py
      - name: "Staff v2, Session setup > Tests: the list, each test's versions as pictures side by side, the switches; the practice copy follows them (R-192, R-201)"
        if: ${{ !cancelled() }}
        run: python3 tests/versions.py
      - name: Density and splits across 70 screens against the recorded baseline (X9-6)
        if: ${{ !cancelled() }}
        run: python3 tests/density.py --check
