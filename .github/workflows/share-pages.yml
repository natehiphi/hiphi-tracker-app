# Share pages (tools/share_pages.mjs, R-067): one small page per HIPHI bill and issue, so a shared link previews with
# the bill's own name; and one calendar feed per issue (cal/<slug>.ics, R-125). Since R-169 (10/5) a bill has a page per
# ask (b/HB2121-testify, -ask, ...), its card leading with the ask and its link opening it.
# Rebuilt from the public views every hour from January to June, so a stance taken or a hearing set this morning has its
# card within the hour (R-169), and each morning the rest of the year; committed only when a page changed. Reads with
# the public key only; no secrets. This repository is public, so its minutes are free (R-111).
name: share-pages
on:
  schedule:
    - cron: '7 * * 1-6 *'       # hourly, January to June (the session and the Governor's weeks)
    - cron: '7 15 * 7-12 *'     # 5:07 am Hawaiʻi time, July to December
  workflow_dispatch:
permissions:
  contents: write
concurrency: share-pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/share_pages.mjs
      - name: Commit when a page changed
        run: |
          git add b i cal
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "share-pages bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Share pages rebuilt from the public views"
          # Someone may have pushed while the pages were built: put this commit on top and try again.
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main; done
          exit 1
