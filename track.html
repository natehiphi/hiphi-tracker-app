<!-- These two scripts run before any stylesheet is asked for: an inline script placed after stylesheet links waits for them
     to load first, and everything it starts (the first screen's module, the catalog) started a whole round trip late. -->
<script>
/* The catalog (categories, issues, their links) is asked for before any module arrives (R-122): three plain fetches with
   the public key in the address (a simple request, so no CORS preflight), and pub/core.js's loadCatalog() takes the
   answer. The issues come slim, only what the topics screen shows (the bill lists and the outlook are two thirds of the
   rows); the full rows follow with the bills. The address and key are pub/core.js's SUPABASE_URL and SUPABASE_KEY (tests/errlog.py checks they match). */
(function () {
  try {
    if (/[?&]demo=1/.test(location.search)) return;
    var U = 'https://eivzjbnygscguqqiiuvh.supabase.co/rest/v1/', K = 'sb_publishable_uvEtw8ru3zB9lDOxAjzrUA_JEFvKyul';
    var get = function (q) { return fetch(U + q + '&apikey=' + K).then(function (r) { if (!r.ok) throw new Error('catalog ' + r.status); return r.json(); }); };
    var all = Promise.all([get('public_categories?select=*&order=sort_order'), get('public_issues?select=id,slug,name,description,category,categories,sort_order,first_visit,top_priority&order=sort_order'), get('public_issue_links?select=issue_a,issue_b')]);
    var late = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('catalog slow')); }, 10000); });
    window.__hiphiCatalog = Promise.race([all, late]);   // settles within ten seconds, so nothing waits on it longer
    window.__hiphiCatalog.catch(function () { /* boot() asks again with the library */ });
    // The A/B tests' switches (R-135, pub/variant.js): a few short rows, asked in the same moment, so the first screen
    // knows which version to draw without waiting.
    window.__hiphiAB = Promise.race([get('public_ab_tests?select=key,arms,is_on,fallback,arms_on'), late]);
    window.__hiphiAB.catch(function () { /* variant.js keeps the last switches it saw */ });
  } catch (e) { /* no fetch: the library asks */ }
})();
</script>
<script>
/* What this browser will need first, preloaded from what it remembers (R-122). A first visit still to do gets the guided
   start and its lessons, and nothing of the database library yet: its first screen needs only the catalog (fetched
   below), and on a slow phone every file competes for the same thin pipe, so the library follows the first screen
   (pub/app.js earlyFirst). Anyone else gets Home and the library with its own parts, pinned with it (pub/core.js
   SUPABASE_JS); without the parts named here the browser would find them only after the library arrived. A wrong guess
   costs one extra download, nothing else. */
(function () {
  var first = true;
  try { var w = JSON.parse(localStorage.getItem('hiphi_wiz') || '{}'); first = !(w.done || w.skipped); } catch (e) { /* storage blocked: a first visit */ }
  var h = location.hash || '', onBill = /^#\/bill\//.test(h);
  // core.js (the bill-level code, with stops.js and rank.js) comes after a newcomer's first screen; everyone else needs it first.
  var core = ['pub/core.js', 'stops.js', 'pub/rank.js'];
  var paths = onBill ? core.concat(['pub/bill.js', 'pub/mylists.js', 'pub/mybills.js', 'pub/actions.js', 'pub/speakup.js']) : first ? ['pub/start.js', 'pub/rank.js'] : core.concat(['pub/home.js', 'pub/actions.js', 'pub/speakup.js']);
  if (/[?&]demo=1/.test(location.search)) paths = paths.concat(core, ['pub/demo.js']);
  // The library and its parts. A first visit asks for them all at once after its first screen (pub/kernel.js makeClient,
  // from this list), so they come in one round trip, not three (10/5: on a slow line the full catalog waited 5 s for them).
  var lib = window.__hiphiLib = ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm',
    'https://cdn.jsdelivr.net/npm/@supabase/postgrest-js@2.117.2/+esm', 'https://cdn.jsdelivr.net/npm/@supabase/auth-js@2.117.2/+esm',
    'https://cdn.jsdelivr.net/npm/@supabase/realtime-js@2.117.2/+esm', 'https://cdn.jsdelivr.net/npm/@supabase/storage-js@2.117.2/+esm',
    'https://cdn.jsdelivr.net/npm/@supabase/functions-js@2.117.2/+esm', 'https://cdn.jsdelivr.net/npm/@supabase/phoenix@0.4.5/+esm',
    'https://cdn.jsdelivr.net/npm/tslib@2.8.1/+esm', 'https://cdn.jsdelivr.net/npm/iceberg-js@0.8.1/+esm'];
  if (!first || onBill || /[?&]demo=1/.test(location.search)) paths = paths.concat(lib);
  for (var i = 0; i < paths.length; i++) { var l = document.createElement('link'); l.rel = 'modulepreload'; l.href = paths[i]; if (paths[i].indexOf('https:') === 0) l.crossOrigin = 'anonymous'; document.head.appendChild(l); }
  // The first screen's stylesheet starts downloading now; pub/app.js puts it in the page in its place (before wide.css,
  // the order of CSS_ORDER) once the module is in, from the cache this preload fills.
  var css = onBill ? ['bill', 'mylists'] : first ? ['start'] : ['home'];
  for (var j = 0; j < css.length; j++) { var s = document.createElement('link'); s.rel = 'preload'; s.as = 'style'; s.href = 'pub/' + css[j] + '.css'; document.head.appendChild(s); }
})();
</script>

<script>
/* ?demo=1&restart: a practice first visit from the very beginning (R-098: two links for the testers, today's ending and
   the new one, tried one after the other on the same phone). Only the sandbox's own storage (hiphi_*_demo) is cleared,
   so the real page in this browser is untouched; then "restart" leaves the address, so a reload keeps the practice run. */
try {
  var q = new URLSearchParams(location.search);
  if (q.has('demo') && q.has('restart')) {
    [localStorage, sessionStorage].forEach(function (s) { for (var i = s.length - 1; i >= 0; i--) { var k = s.key(i); if (k && k.indexOf('hiphi_') === 0 && /_demo$/.test(k)) s.removeItem(k); } });
    q.delete('restart');
    history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
  }
} catch (e) { /* storage blocked: nothing to clear */ }
</script>
<script>
/* The page's own error reports, part one (R-111, the assessment's U1; the rest is pub/errlog.js, which takes over once
   the app's code runs). Errors from before that, and a page whose code never starts (9/28: blank for 15 minutes), would
   otherwise go unreported. The same rules as errlog.js: nothing with the privacy signal or from a test run, nothing
   personal. The address and key are pub/core.js's SUPABASE_URL and SUPABASE_KEY (tests/errlog.py checks they match). */
(function () {
  var E = window.__hiphiErrs = { early: [], handled: false, booted: false };
  var text = function (e) { try { var r = e && (e.reason || e.error); return String((e && e.message) || (r && r.message) || r || '').slice(0, 200); } catch (x) { return ''; } };
  var file = function (e) { try { return e && e.filename ? String(e.filename).replace(/^https?:\/\/[^/]+/, '').split('?')[0] + ':' + (e.lineno || 0) + ':' + (e.colno || 0) : ''; } catch (x) { return ''; } };
  window.addEventListener('error', function (e) { if (!E.handled && E.early.length < 5) E.early.push({ kind: 'error', message: text(e), source: file(e) }); });
  window.addEventListener('unhandledrejection', function (e) { if (!E.handled && E.early.length < 5) E.early.push({ kind: 'rejection', message: text(e), source: '' }); });
  setTimeout(function () {
    if (E.handled || E.booted) return;
    var quiet = false;
    try { quiet = navigator.globalPrivacyControl === true || navigator.doNotTrack === '1' || window.doNotTrack === '1' || ((navigator.webdriver === true || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) && window.__hiphiCountTests !== true); } catch (x) { quiet = true; }
    if (quiet) return;
    var first = E.early[0] || {}, w = window.innerWidth || 0;
    var p = { kind: 'boot', place: 'start-up', message: ('The page did not start in 20 seconds. ' + (first.message || '')).slice(0, 200), source: first.source || '',
      device: w < 600 ? 'phone' : w < 1024 ? 'tablet' : 'laptop', sandbox: /[?&]demo=1/.test(location.search) };
    try {
      fetch('https://eivzjbnygscguqqiiuvh.supabase.co/rest/v1/rpc/log_public_error', { method: 'POST', keepalive: true,
        headers: { 'content-type': 'application/json', apikey: 'sb_publishable_uvEtw8ru3zB9lDOxAjzrUA_JEFvKyul', authorization: 'Bearer sb_publishable_uvEtw8ru3zB9lDOxAjzrUA_JEFvKyul' },
        body: JSON.stringify({ p: p }) }).catch(function () {});
    } catch (x) { /* nothing to do */ }
  }, 20000);
})();
</script>
