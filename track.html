<!-- On paper (R-212 #48): its own stylesheet, here in <body> so it comes after every screen's (pub/app.js adds those to
     <head> as they are needed), and the line that says where a printed page came from. A browser fetches a print sheet with the
     first wave all the same, so it has no href until the first screen is drawn (R-357 5c): __hiphiPrint.css below sets it. -->
<link rel="stylesheet" media="print" data-href="pub/print.css" id="prcss">

<script>
/* Printing (R-212 #48; the look is pub/print.css). While the page prints: every closed fold opens, and closes again after,
   exactly as it was, without the screens' own fold listeners hearing it (so nothing is remembered as opened or counted);
   a box of text prints as a copy of its words (a box would cut a letter off at its own height); an open sheet prints alone,
   with the line under it; and the line says where the page came from. Both signals are heard: beforeprint/afterprint and
   the print media query (Safari, and a test's emulated print, send only that). The line is in English: this runs outside
   the app's modules, so their words (pub/i18n.js) are out of reach, and no other language is live yet. */
(function () {
  var on = false, opened = [], quiet = new WeakSet(), boxes = [], copies = [], sheet = null, mo = null;
  var line = document.getElementById('pr-from'), spot = line && line.parentNode, after = line && line.nextSibling;
  // The paper's stylesheet is asked for after the first screen (pub/app.js), at the load event, or when printing starts (R-357 5c).
  var pcss = document.getElementById('prcss');
  function css() { if (pcss && !pcss.getAttribute('href')) pcss.setAttribute('href', pcss.getAttribute('data-href')); }
  // Where to find it again: this address without its one-time parts (restart, via, ...), the practice copy kept, and the
  // screen's own address without the screen it was opened from (?from=).
  function where() {
    var h = location.hash || '', i = h.indexOf('?');
    if (i >= 0) { var q = new URLSearchParams(h.slice(i + 1)); q.delete('from'); h = h.slice(0, i) + (String(q) ? '?' + q : ''); }
    return location.host + location.pathname + (/[?&]demo=1(&|$)/.test(location.search) ? '?demo=1' : '') + h;
  }
  // The app's own clock and date style, with the weekday ("Mon, Mar 16, 2026"), so the page's own "today", "tomorrow" and
  // weekdays can be read on paper; the practice copy's printed day is its made-up one, as its band says.
  function today() {
    try { return new Date().toLocaleDateString('en-US', { timeZone: 'Pacific/Honolulu', weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }); }
    catch (e) { return new Date().toDateString(); }
  }
  // What the paper needs, for everything on the page now and again whenever a screen draws itself while printing (a laptop's
  // bill page redraws for the paper's narrower page, pub/bill.js WIDE): folds open, boxes of text copied, the sheet marked.
  function sweep() {
    var all = document.querySelectorAll('details:not([open])'), i;
    for (i = 0; i < all.length; i++) { quiet.add(all[i]); all[i].open = true; opened.push(all[i]); }
    var tas = document.querySelectorAll('textarea:not(.pr-hascopy)');
    for (i = 0; i < tas.length; i++) {
      var t = tas[i]; t.classList.add('pr-hascopy'); boxes.push(t);
      if (!t.value.trim()) continue;
      var c = document.createElement('div'); c.className = 'pr-copy'; c.textContent = t.value; t.parentNode.insertBefore(c, t.nextSibling); copies.push(c);
    }
    var open = document.querySelectorAll('dialog[open]'), s = open.length ? open[open.length - 1] : null;
    if (s !== sheet) {
      if (sheet) sheet.removeAttribute('data-pr-sheet');
      sheet = s; if (sheet) sheet.setAttribute('data-pr-sheet', '');
      document.documentElement.classList.toggle('pr-sheet', !!sheet);
    }
    if (line && line.parentNode !== (sheet || spot)) (sheet || spot).appendChild(line);
  }
  function start() {
    if (on) return; on = true;
    css();
    var day = today();
    // The day at the top of page 1 too, after the brand (pub/print.css puts it there and on a sheet printed alone): the page's
    // deadlines say "today", "tomorrow" or a weekday, and this is the day they mean (docs/DESIGN-AUDIT.md, section 4).
    document.documentElement.style.setProperty('--pr-day', JSON.stringify(' \u00b7 Printed ' + day));
    if (line) line.textContent = 'Printed ' + day + ' from HIPHI\u2019s Bill Tracker. For the latest: ' + where();
    sweep();
    try { mo = new MutationObserver(sweep); mo.observe(document.body, { childList: true, subtree: true }); } catch (e) { mo = null; }
  }
  function end() {
    if (!on) return; on = false;
    if (mo) { mo.disconnect(); mo = null; }
    for (var i = 0; i < opened.length; i++) opened[i].open = false;
    for (i = 0; i < boxes.length; i++) boxes[i].classList.remove('pr-hascopy');
    for (i = 0; i < copies.length; i++) copies[i].remove();
    opened = []; boxes = []; copies = [];
    if (sheet) sheet.removeAttribute('data-pr-sheet');
    sheet = null; document.documentElement.classList.remove('pr-sheet'); document.documentElement.style.removeProperty('--pr-day');
    if (line) { line.textContent = ''; spot.insertBefore(line, after && after.parentNode === spot ? after : null); }
  }
  // A fold opened or closed for the paper is not the person's: its toggle event stops here, before any screen hears it.
  window.addEventListener('toggle', function (e) {
    var d = e.target; if (!quiet.has(d)) return;
    e.stopImmediatePropagation();
    if (!on && !d.open) quiet.delete(d);
  }, true);
  window.addEventListener('beforeprint', start);
  window.addEventListener('afterprint', end);
  // The bill page's "Print this page" starts it before asking the browser to print (pub/bill.js), for a phone whose browser
  // may not say it is about to print; the end still comes from afterprint or the print media query.
  window.__hiphiPrint = { start: start, end: end, css: css };
  window.addEventListener('load', function () { setTimeout(css, 3000); });
  try {
    var mq = window.matchMedia('print'), f = function (e) { if (e.matches) start(); else end(); };
    if (mq.addEventListener) mq.addEventListener('change', f); else mq.addListener(f);
  } catch (e) { /* no media queries to hear: beforeprint and afterprint do it */ }
})();
</script>
<script>
/* ?demo=1&restart: a practice first visit from the very beginning (R-098: two links for the testers, today's ending and
   the new one, tried one after the other on the same phone). Only the sandbox's own storage (hiphi_*_demo) is cleared,
   so the real page in this browser is untouched; then "restart" leaves the address, so a reload keeps the practice run. */
try {
  var q = new URLSearchParams(location.search);
  /* Tester links that have ended (R-204, Nate 10/7: "It should not allow anybody to access the app at all"). A printed link
     or QR code keeps working wherever it went, so an ended one goes to test-ended.html, which says the test has ended and
     has no way into the tracker, before any of the app loads. In the moment before that page arrives the address loses its
     versions and gains &ended, so the app does not start (pub/app.js) and nothing is recorded (pub/testerlog.js starts only
     on a link that sets versions). Matched exactly: the practice copy, the versions the link set (in any order), and no &t
     or &abrest, so the tester sheet's links and the check links (?ab=onb.today alone, ?ab=onb.p1 ...) still work. An
     address already marked &ended (the first build of R-204, an hour on 10/7, opened the practice copy) goes there too.
     To end another, add its versions, sorted. */
  var ENDED = ['end.home,onb.today'];   // the tester sheet's link of 6 Oct: ?demo=1&restart&ab=onb.today,end.home
  if (q.has('demo') && (q.has('ended') || (q.has('ab') && !q.has('t') && !q.has('abrest') && ENDED.indexOf(q.get('ab').split(',').sort().join(',')) >= 0))) {
    q.delete('ab'); q.set('ended', '1');
    sessionStorage.removeItem('hiphi_tester_demo'); sessionStorage.removeItem('hiphi_tester');
    history.replaceState(null, '', location.pathname + '?' + q.toString());
    location.replace('test-ended.html');
  }
  if (q.has('demo') && q.has('restart')) {
    [localStorage, sessionStorage].forEach(function (s) { for (var i = s.length - 1; i >= 0; i--) { var k = s.key(i); if (k && k.indexOf('hiphi_') === 0 && /_demo$/.test(k)) s.removeItem(k); } });
    q.delete('restart');
    history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
  }
  /* ?demo=1&later: the practice copy's "Next day" (R-187, pub/app.js nextDay): the visit after the first one, so the first
     visit's welcome (hiphi_welcome, kept for the rest of a visit) ends and Home takes its everyday shape. */
  if (q.has('demo') && q.has('later')) {
    sessionStorage.removeItem('hiphi_welcome_demo');
    q.delete('later');
    history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
  }
} catch (e) { /* storage blocked: nothing to clear */ }
</script>
<script>
/* The page's own error reports, part one (R-111, the assessment's U1; the rest is pub/errlog.js, which takes over once
   the app's code runs). Errors from before that, and a page whose code never starts (9/28: blank for 15 minutes), would
   otherwise go unreported. The same rules as errlog.js: nothing with the privacy signal or from a test run, nothing
   personal. The address and key are pub/core.js's SUPABASE_URL and SUPABASE_KEY (tests/errlog.py checks they match). */
(function () {

  var text = function (e) { try { var r = e && (e.reason || e.error); return String((e && e.message) || (r && r.message) || r || '').slice(0, 200); } catch (x) { return ''; } };
  var file = function (e) { try { return e && e.filename ? String(e.filename).replace(/^https?:\/\/[^/]+/, '').split('?')[0] + ':' + (e.lineno || 0) + ':' + (e.colno || 0) : ''; } catch (x) { return ''; } };
  window.addEventListener('error', function (e) { if (!E.handled && E.early.length < 5) E.early.push({ kind: 'error', message: text(e), source: file(e) }); });

  setTimeout(function () {
    // The app's code never started (R-212 #49): instead of a skeleton that never goes away, the page says so, to everyone
    // (only the report below waits on the privacy signal), in the app's own look (pub/ui.js loadFail), and its Try again
    // reloads the page. Its own words (the ui-critic's review): the usual cause is a slow connection or a Wi-Fi sign-in page,
    // where the browser still says it is online, so this one does say to check the connection. In English: the app's words
    // in other languages (pub/i18n.js) are out of reach here.
    if (!E.ran && !E.booted) {
      try {
        var box = document.getElementById('app');
        var el = function (tag, cls, txt) { var n = document.createElement(tag); if (cls) n.className = cls; if (txt) n.textContent = txt; return n; };
        var top = el('div', 'boot0top', 'Bill Tracker'); top.appendChild(el('small', '', 'Hawaiʻi health bills · from HIPHI'));
        var card = el('div', 'empty loadfail'); card.setAttribute('role', 'alert');
        card.appendChild(el('h1', '', 'We couldn’t load the tracker'));
        card.appendChild(el('p', '', 'The tracker is taking too long to start. Check your connection, then press Try again.'));
        var again = el('a', 'btn primary', 'Try again'); again.href = location.href; again.onclick = function (e) { e.preventDefault(); location.reload(); };
        card.appendChild(again);

    if (quiet) return;
    var first = E.early[0] || {}, w = window.innerWidth || 0;
    var p = { kind: 'boot', place: 'start-up', message: ('The page did not start in 20 seconds. ' + (first.message || '')).slice(0, 200), source: first.source || '',
      device: w < 600 ? 'phone' : w < 1024 ? 'tablet' : 'laptop', sandbox: /[?&]demo=1/.test(location.search) };
    try {
      fetch('https://eivzjbnygscguqqiiuvh.supabase.co/rest/v1/rpc/log_public_error', { method: 'POST', keepalive: true,
        headers: { 'content-type': 'application/json', apikey: 'sb_publishable_uvEtw8ru3zB9lDOxAjzrUA_JEFvKyul', authorization: 'Bearer sb_publishable_uvEtw8ru3zB9lDOxAjzrUA_JEFvKyul' },
        body: JSON.stringify({ p: p }) }).catch(function () {});
    } catch (x) { /* nothing to do */ }

</script>
