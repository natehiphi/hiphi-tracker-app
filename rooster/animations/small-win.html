<title>Rooster · Small win · head bob</title>
<!--
  HIPHI rooster · Small win · head bob
  Use: A small step done: saving or following a bill, picking a stance, an address found.
  Trigger: Right after the action succeeds, next to the thing just done.
  Plays: once · about 600 ms
  Reduce Motion: Rooster stands still; sparks hidden. Pair with fx.js tint() on the control.
  Design rules: Fits A-10 (small burst under 0.7 s) and C-7 (small win, small burst).
  Self-contained: the inline SVG + this file's CSS are the whole animation. It plays once on load (loops loop).
  To replay, re-insert the element (or reload). See ../README.md for how to wire it in through pub/fx.js.
-->
<style>
body{margin:0}
a{color:#00698E}a:hover{color:#024F69}
.s-body{transform-box:fill-box;transform-origin:50% 100%;animation:s-body .45s cubic-bezier(.2,.7,.3,1) .1s both}
.s-head{transform-box:fill-box;transform-origin:20% 90%;animation:s-head .45s cubic-bezier(.2,.7,.3,1) .1s both}
.s-comb{transform-box:fill-box;transform-origin:50% 115%;animation:s-comb .5s ease .1s both}
.s-tail{transform-box:fill-box;transform-origin:100% 80%;animation:s-tail .45s cubic-bezier(.2,.7,.3,1) .1s both}
.s-spark{transform-box:fill-box;transform-origin:0% 100%;opacity:0;animation:s-spark .5s cubic-bezier(.34,1.4,.64,1) .22s both}
@keyframes s-body{0%{transform:scale(1,1)}30%{transform:scale(1.04,.95)}62%{transform:scale(.98,1.03)}100%{transform:scale(1,1)}}
@keyframes s-head{0%{transform:rotate(0)}30%{transform:rotate(10deg)}62%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@keyframes s-comb{0%,30%{transform:rotate(0)}55%{transform:rotate(-9deg)}78%{transform:rotate(6deg)}100%{transform:rotate(0)}}
@keyframes s-tail{0%{transform:rotate(0)}35%{transform:rotate(-10deg)}70%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes s-spark{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){
.s-body,.s-head,.s-comb,.s-tail{animation:none}
.s-spark{display:none}
}
</style>
</head>
