<title>Rooster · Error · gentle head tilt</title>
<!--
  HIPHI rooster · Error · gentle head tilt
  Use: Something failed (a send, a save). Sympathetic, never silly.
  Trigger: With the error message; the message carries the meaning (A-10: motion never alone).
  Plays: once · about 1500 ms
  Reduce Motion: Rooster still with the concerned brow showing.
  Design rules: Fits A-10. Keep the error words and the retry button visible; the rooster is decoration.
  Self-contained: the inline SVG + this file's CSS are the whole animation. It plays once on load (loops loop).
  To replay, re-insert the element (or reload). See ../README.md for how to wire it in through pub/fx.js.
-->
<style>
body{margin:0}
a{color:#00698E}a:hover{color:#024F69}
.e-body{transform-box:fill-box;transform-origin:50% 100%;animation:e-body 1.4s cubic-bezier(.2,.7,.3,1) .1s both}
.e-head{transform-box:view-box;transform-origin:118px 100px;animation:e-head 1.4s cubic-bezier(.2,.7,.3,1) .1s both}
.e-tail{transform-box:fill-box;transform-origin:100% 80%;animation:e-tail 1.4s cubic-bezier(.2,.7,.3,1) .1s both}
.e-wing{transform-box:fill-box;transform-origin:85% 15%;animation:e-wing 1.4s cubic-bezier(.2,.7,.3,1) .1s both}
.e-brow{opacity:0;animation:e-brow 1.4s ease .1s both}
.e-eye{transform-box:fill-box;transform-origin:center;animation:e-blink .3s ease .8s both}
@keyframes e-body{0%{transform:scale(1,1)}35%{transform:scale(1.01,.97)}100%{transform:scale(1,.985)}}
@keyframes e-head{0%{transform:rotate(0)}35%,75%{transform:rotate(9deg)}100%{transform:rotate(3deg)}}
@keyframes e-tail{0%{transform:rotate(0)}35%{transform:rotate(10deg)}100%{transform:rotate(5deg)}}
@keyframes e-wing{0%{transform:rotate(0)}35%{transform:rotate(-6deg)}100%{transform:rotate(-3deg)}}
@keyframes e-brow{0%,20%{opacity:0}35%,100%{opacity:1}}
@keyframes e-blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){
.e-body,.e-head,.e-tail,.e-wing,.e-eye{animation:none}
.e-brow{animation:none;opacity:1}
}
</style>
</head>
