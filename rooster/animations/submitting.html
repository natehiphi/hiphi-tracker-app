<!doctype html>

<title>Rooster · Submitting · pecking loop</title>
<!--
  HIPHI rooster · Submitting · pecking loop
  Use: While testimony or a form is sending.
  Trigger: Start when the request is sent; remove when it finishes.
  Plays: loop · about 1000 ms
  Reduce Motion: Rooster still; the three dots pulse slowly. Screen readers hear 'Sending your testimony' (role=status).
  Design rules: A-10: nothing moves by itself for more than 5 s. Stop the loop at 5 s and show the still rooster with words if the send is slow.
  Self-contained: the inline SVG + this file's CSS are the whole animation. It plays once on load (loops loop).
  To replay, re-insert the element (or reload). See ../README.md for how to wire it in through pub/fx.js.
-->
<style>
body{margin:0}
a{color:#00698E}a:hover{color:#024F69}
.p-upper{transform-box:view-box;transform-origin:100px 158px;animation:p-peck 1s cubic-bezier(.2,.7,.3,1) infinite}
.p-head{transform-box:view-box;transform-origin:118px 100px;animation:p-nod 1s cubic-bezier(.2,.7,.3,1) infinite}
.p-tail{transform-box:fill-box;transform-origin:100% 80%;animation:p-tail 1s ease infinite}
.p-shadow{transform-origin:center;animation:p-shadow 1s cubic-bezier(.2,.7,.3,1) infinite}
.p-dot{width:10px;height:10px;border-radius:50%;background:#00698E;opacity:.25;animation:p-dot 1.2s ease-in-out infinite}
.p-dot2{animation-delay:.2s}
.p-dot3{animation-delay:.4s}
.paused .p-upper,.paused .p-head,.paused .p-tail,.paused .p-shadow,.paused .p-dot{animation-play-state:paused}
@keyframes p-peck{0%,20%{transform:rotate(0)}32%{transform:rotate(22deg)}38%{transform:rotate(16deg)}44%{transform:rotate(22deg)}56%,100%{transform:rotate(0)}}
@keyframes p-nod{0%,20%{transform:rotate(0)}32%{transform:rotate(10deg)}38%{transform:rotate(4deg)}44%{transform:rotate(10deg)}56%,100%{transform:rotate(0)}}
@keyframes p-tail{0%,30%{transform:rotate(0)}44%{transform:rotate(-6deg)}62%{transform:rotate(3deg)}76%,100%{transform:rotate(0)}}
@keyframes p-shadow{0%,20%{transform:scaleX(1)}32%,44%{transform:scaleX(1.08) translateX(6px)}56%,100%{transform:scaleX(1)}}
@keyframes p-dot{0%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
.p-upper,.p-head,.p-tail,.p-shadow{animation:none}
.p-dot{animation-duration:2.4s}
}
</style>
</head>
