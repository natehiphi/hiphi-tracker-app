<title>Rooster · Empty state · peck and look up</title>
<!--
  HIPHI rooster · Empty state · peck and look up
  Use: Empty lists: no bills saved yet, nothing due this week.
  Trigger: When the empty state renders, next to its words and the action that fills it.
  Plays: loop · about 5000 ms
  Reduce Motion: Rooster stands still.
  Design rules: A-10: nothing moves by itself for more than 5 s. Play one 5 s cycle, then stop (animation-iteration-count: 1).
  Self-contained: the inline SVG + this file's CSS are the whole animation. It plays once on load (loops loop).
  To replay, re-insert the element (or reload). See ../README.md for how to wire it in through pub/fx.js.
-->
<style>
body{margin:0}
a{color:#00698E}a:hover{color:#024F69}
.n-upper{transform-box:view-box;transform-origin:100px 158px;animation:n-upper 5s cubic-bezier(.2,.7,.3,1) infinite}
.n-head{transform-box:view-box;transform-origin:118px 100px;animation:n-head 5s cubic-bezier(.2,.7,.3,1) infinite}
.n-comb{transform-box:fill-box;transform-origin:50% 115%;animation:n-comb 5s ease infinite}
.n-tail{transform-box:fill-box;transform-origin:100% 80%;animation:n-tail 5s ease infinite}
.n-eye{transform-box:fill-box;transform-origin:center;animation:n-blink 5s linear infinite}
.n-shadow{transform-origin:center;animation:n-shadow 5s cubic-bezier(.2,.7,.3,1) infinite}
.paused .n-upper,.paused .n-head,.paused .n-comb,.paused .n-tail,.paused .n-eye,.paused .n-shadow{animation-play-state:paused}
@keyframes n-upper{0%,8%{transform:rotate(0)}13%{transform:rotate(28deg)}16%{transform:rotate(20deg)}19%{transform:rotate(28deg)}26%,34%{transform:rotate(0)}39%{transform:rotate(28deg)}43%,100%{transform:rotate(0)}}
@keyframes n-head{0%,8%{transform:rotate(0)}13%{transform:rotate(12deg)}16%{transform:rotate(6deg)}19%{transform:rotate(12deg)}26%,34%{transform:rotate(0)}39%{transform:rotate(12deg)}43%,52%{transform:rotate(0)}58%,74%{transform:rotate(-10deg)}80%,100%{transform:rotate(0)}}
@keyframes n-comb{0%,78%{transform:rotate(0)}83%{transform:rotate(-5deg)}87%{transform:rotate(3deg)}91%,100%{transform:rotate(0)}}
@keyframes n-tail{0%,24%{transform:rotate(0)}28%{transform:rotate(-8deg)}32%{transform:rotate(3deg)}36%,100%{transform:rotate(0)}}
@keyframes n-blink{0%,64%{transform:scaleY(1)}66%{transform:scaleY(.1)}68%,100%{transform:scaleY(1)}}
@keyframes n-shadow{0%,8%{transform:scaleX(1)}13%,19%{transform:scaleX(1.08) translateX(6px)}26%,34%{transform:scaleX(1)}39%{transform:scaleX(1.08) translateX(6px)}43%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){
.n-upper,.n-head,.n-comb,.n-tail,.n-shadow{animation:none}
}
</style>
</head>
