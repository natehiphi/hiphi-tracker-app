<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Rooster · Streak · quick ta-da</title>
<!--
  HIPHI rooster · Streak · quick ta-da
  Use: Several actions in one session.
  Trigger: After the third action in a session.
  Plays: once · about 1000 ms
  Reduce Motion: Rooster still; the three sparkles show without moving.
  Design rules: CONFLICT with C-7 ('Never a streak counter, a badge, a score'). The three sparkles read as a count. Do not use without Nate's decision; if kept, use it as the session-end burst on Home (C-7) without the counting sparkles.
  Self-contained: the inline SVG + this file's CSS are the whole animation. It plays once on load (loops loop).
  To replay, re-insert the element (or reload). See ../README.md for how to wire it in through pub/fx.js.
-->
<style>
body{margin:0}
a{color:#00698E}a:hover{color:#024F69}
.k-body{transform-box:fill-box;transform-origin:50% 100%;animation:k-body .9s cubic-bezier(.2,.7,.3,1) .1s both}
.k-wing{transform-box:fill-box;transform-origin:85% 15%;animation:k-wing .9s cubic-bezier(.2,.7,.3,1) .1s both}
.k-wing2{transform-box:fill-box;transform-origin:85% 15%;animation:k-wing2 .9s cubic-bezier(.2,.7,.3,1) .1s both}
.k-head{transform-box:view-box;transform-origin:118px 100px;animation:k-head .9s cubic-bezier(.2,.7,.3,1) .1s both}
.k-tail{transform-box:fill-box;transform-origin:100% 80%;animation:k-tail .9s cubic-bezier(.2,.7,.3,1) .1s both}
.k-open{animation:k-hide .9s linear .1s both}
.k-happy{opacity:0;animation:k-show .9s linear .1s both}
.k-shadow{transform-origin:center;animation:k-shadow .9s cubic-bezier(.2,.7,.3,1) .1s both}
.k-star{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;animation:k-star 1.1s cubic-bezier(.34,1.4,.64,1) both}
@keyframes k-body{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.06,.92)}40%{transform:translateY(-16px) scale(.97,1.04)}65%{transform:translateY(0) scale(1.05,.95)}85%,100%{transform:translateY(0) scale(1,1)}}
@keyframes k-wing{0%,15%{transform:rotate(0)}40%,60%{transform:rotate(70deg)}85%,100%{transform:rotate(0)}}
@keyframes k-wing2{0%,15%{transform:rotate(0)}40%,60%{transform:rotate(55deg)}85%,100%{transform:rotate(0)}}
@keyframes k-head{0%{transform:rotate(0)}40%,60%{transform:rotate(-8deg)}85%,100%{transform:rotate(0)}}
@keyframes k-tail{0%{transform:rotate(0)}40%{transform:rotate(-12deg)}70%{transform:rotate(5deg)}100%{transform:rotate(0)}}
@keyframes k-hide{0%,34%{opacity:1}35%,75%{opacity:0}76%,100%{opacity:1}}
@keyframes k-show{0%,34%{opacity:0}35%,75%{opacity:1}76%,100%{opacity:0}}
@keyframes k-shadow{0%,15%{transform:scaleX(1.08)}40%{transform:scaleX(.8);opacity:.12}65%{transform:scaleX(1.1)}100%{transform:scaleX(1)}}
@keyframes k-star{0%{opacity:0;transform:scale(.3) rotate(-20deg)}25%{opacity:1;transform:scale(1.15) rotate(0)}40%,75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9) translateY(-8px)}}
@media (prefers-reduced-motion: reduce){
.k-body,.k-wing,.k-wing2,.k-head,.k-tail,.k-shadow{animation:none}
.k-open{animation:none;opacity:1}
.k-happy{display:none}
.k-star{animation:none;opacity:1}
}
</style>
</head>
