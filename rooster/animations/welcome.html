<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rooster · Welcome · strut and wave</title>
<!--
  HIPHI rooster · Welcome · strut and wave
  Use: First visit or onboarding: introduces the rooster.
  Trigger: When the welcome screen opens; the welcome words sit beside it.
  Plays: once · about 2300 ms
  Reduce Motion: Rooster stands in place, no walk-in or wave.
  Design rules: Under the 5 s limit (A-10). Must not cover or delay the first visit's Next, and the first visit must still fit the window (R-265).
  Self-contained: the inline SVG + this file's CSS are the whole animation. It plays once on load (loops loop).
  To replay, re-insert the element (or reload). See ../README.md for how to wire it in through pub/fx.js.
-->
<style>
body{margin:0}
a{color:#00698E}a:hover{color:#024F69}
.w-enter{animation:w-enter .9s cubic-bezier(.2,.7,.3,1) .1s both}
.w-bob{animation:w-bob .9s linear .1s both}
.w-legA{transform-box:view-box;transform-origin:90px 156px;animation:w-legA .9s linear .1s both}
.w-legB{transform-box:view-box;transform-origin:110px 156px;animation:w-legB .9s linear .1s both}
.w-wing{transform-box:fill-box;transform-origin:85% 15%;animation:w-wave 1s ease-in-out 1s both}
.w-head{transform-box:view-box;transform-origin:118px 100px;animation:w-head 1s cubic-bezier(.2,.7,.3,1) 1s both}
.w-comb{transform-box:fill-box;transform-origin:50% 115%;animation:w-comb .5s ease .95s both}
.w-tail{transform-box:fill-box;transform-origin:100% 80%;animation:w-tail .5s ease .95s both}
.w-eye{transform-box:fill-box;transform-origin:center;animation:w-blink .22s ease 2.05s both}
@keyframes w-enter{0%{transform:translateX(-340px)}100%{transform:translateX(0)}}
@keyframes w-bob{0%{transform:translateY(0)}12.5%{transform:translateY(-6px)}25%{transform:translateY(0)}37.5%{transform:translateY(-6px)}50%{transform:translateY(0)}62.5%{transform:translateY(-6px)}75%{transform:translateY(0)}87.5%{transform:translateY(-3px)}100%{transform:translateY(0)}}
@keyframes w-legA{0%{transform:rotate(18deg)}25%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}75%{transform:rotate(-14deg)}100%{transform:rotate(0)}}
@keyframes w-legB{0%{transform:rotate(-18deg)}25%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}75%{transform:rotate(14deg)}100%{transform:rotate(0)}}
@keyframes w-wave{0%{transform:rotate(0)}18%{transform:rotate(105deg)}32%{transform:rotate(88deg)}46%{transform:rotate(112deg)}60%{transform:rotate(88deg)}74%{transform:rotate(105deg)}100%{transform:rotate(0)}}
@keyframes w-head{0%{transform:rotate(0)}20%,80%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@keyframes w-comb{0%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes w-tail{0%{transform:rotate(0)}35%{transform:rotate(-10deg)}70%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes w-blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){
.w-enter,.w-bob,.w-legA,.w-legB,.w-wing,.w-head,.w-comb,.w-tail,.w-eye{animation:none}
}
</style>
</head>
<body style="margin:0;background:#F4F7F9">
<div style="width: 480px; height: 480px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F7F9; font-family: Lato, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #142B35">

</g>

<ellipse cx="158" cy="93" rx="6.5" ry="12" fill="#E5483A"></ellipse>
<path d="M160 64 L179 72 L160 80 Z" fill="#FBB040" stroke="#FBB040" stroke-width="3" stroke-linejoin="round"></path>

</g>
</g>
</g>
</g>
</svg>
</div>
</div>
</div>

</html>
