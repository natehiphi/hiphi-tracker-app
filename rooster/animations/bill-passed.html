<title>Rooster · Bill passed · lei bloom</title>
<!--
  HIPHI rooster · Bill passed · lei bloom
  Use: A bill the person follows or acted on becomes law.
  Trigger: When the person first sees that the bill passed.
  Plays: once · about 2900 ms
  Reduce Motion: Rooster stands still already wearing the lei; no sparkles.
  Design rules: C-7 names 'a bill becoming law' as a full-screen moment, capped at 1.5 s by A-10: either start it at the bloom (skip the hop, about 1.3 s) or show it on a page that waits for Next.
  Self-contained: the inline SVG + this file's CSS are the whole animation. It plays once on load (loops loop).
  To replay, re-insert the element (or reload). See ../README.md for how to wire it in through pub/fx.js.
-->
