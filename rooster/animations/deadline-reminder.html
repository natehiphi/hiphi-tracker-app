<title>Rooster · Deadline reminder · ahem</title>
<!--
  HIPHI rooster · Deadline reminder · ahem
  Use: A gentle nudge: testimony due tomorrow, a hearing soon.
  Trigger: When the reminder card or toast appears, beside its words.
  Plays: once · about 1500 ms
  Reduce Motion: Rooster stands still.
  Design rules: Fits A-10. Never alarming; the reminder words carry the date.
  Self-contained: the inline SVG + this file's CSS are the whole animation. It plays once on load (loops loop).
  To replay, re-insert the element (or reload). See ../README.md for how to wire it in through pub/fx.js.
-->
<style>
body{margin:0}
a{color:#00698E}a:hover{color:#024F69}
.a-body{transform-box:fill-box;transform-origin:50% 100%;animation:a-body 1.4s cubic-bezier(.2,.7,.3,1) .1s both}
.a-head{transform-box:view-box;transform-origin:118px 100px;animation:a-head 1.4s cubic-bezier(.2,.7,.3,1) .1s both}
.a-wing{transform-box:fill-box;transform-origin:85% 15%;animation:a-wing 1.4s cubic-bezier(.2,.7,.3,1) .1s both}
.a-tail{transform-box:fill-box;transform-origin:100% 80%;animation:a-tail 1.4s cubic-bezier(.2,.7,.3,1) .1s both}
.a-closed{animation:a-hide 1.4s linear .1s both}
.a-open{opacity:0;animation:a-show 1.4s linear .1s both}
.a-wave{transform-box:fill-box;transform-origin:0% 50%;opacity:0;animation:a-wave 1.4s ease-out .1s both}
.a-eye{transform-box:fill-box;transform-origin:center;animation:a-blink .22s ease 1.25s both}
@keyframes a-body{0%{transform:scale(1,1)}25%,65%{transform:scale(1.04,1.03)}100%{transform:scale(1,1)}}
@keyframes a-head{0%{transform:rotate(0)}25%{transform:rotate(-8deg)}40%{transform:rotate(-5deg)}55%{transform:rotate(-8deg)}75%,100%{transform:rotate(0)}}
@keyframes a-wing{0%{transform:rotate(0)}25%,65%{transform:rotate(-16deg)}100%{transform:rotate(0)}}
@keyframes a-tail{0%{transform:rotate(0)}25%,65%{transform:rotate(-8deg)}100%{transform:rotate(0)}}
@keyframes a-hide{0%,31%{opacity:1}32%,51%{opacity:0}52%,100%{opacity:1}}
@keyframes a-show{0%,31%{opacity:0}32%,51%{opacity:1}52%,100%{opacity:0}}
@keyframes a-wave{0%,33%{opacity:0;transform:scale(.6)}40%{opacity:1}70%,100%{opacity:0;transform:scale(1.25)}}
@keyframes a-blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){
.a-body,.a-head,.a-wing,.a-tail,.a-eye{animation:none}
.a-closed{animation:none;opacity:1}
.a-open,.a-wave{display:none}
}
</style>
</head>
