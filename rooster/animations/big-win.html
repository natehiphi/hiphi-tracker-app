<title>Rooster · Big win · hop and ta-da</title>
<!--
  HIPHI rooster · Big win · hop and ta-da
  Use: A big step: testimony submitted, the first action sent.
  Trigger: After the submit succeeds; plays over the next screen once its slide has ended (A-10).
  Plays: once · about 1600 ms
  Reduce Motion: Rooster stands still; feathers, ring and petals hidden.
  Design rules: C-7 moment. A-10 caps a full-screen moment at 1.5 s and says any tap, key or scroll ends it: trim the last 0.1 s of feather drift and make it dismissable when wiring it in.
  Self-contained: the inline SVG + this file's CSS are the whole animation. It plays once on load (loops loop).
  To replay, re-insert the element (or reload). See ../README.md for how to wire it in through pub/fx.js.
-->
<style>
body{margin:0}
a{color:#00698E}a:hover{color:#024F69}
.r-pop{transform-origin:50% 92%;animation:r-pop .34s cubic-bezier(.34,1.4,.64,1) both}
.r-hop{transform-box:fill-box;transform-origin:50% 100%;animation:r-hop 1.3s cubic-bezier(.2,.7,.3,1) .2s both}
.r-wing{transform-box:fill-box;transform-origin:85% 15%;animation:r-flap 1.3s linear .2s both}
.r-wing2{transform-box:fill-box;transform-origin:85% 15%;animation:r-flap2 1.3s linear .2s both}
.r-tail{transform-box:fill-box;transform-origin:100% 80%;animation:r-tail 1.3s cubic-bezier(.2,.7,.3,1) .2s both}
.r-head{transform-box:fill-box;transform-origin:20% 90%;animation:r-head 1.3s cubic-bezier(.2,.7,.3,1) .2s both}
.r-comb{transform-box:fill-box;transform-origin:50% 115%;animation:r-comb 1.3s ease .2s both}
.r-eye{transform-box:fill-box;transform-origin:center;animation:r-blink .22s ease 1.34s both}
.r-shadow{transform-origin:center;animation:r-shadow 1.3s cubic-bezier(.2,.7,.3,1) .2s both}
.r-ring{transform-origin:center;opacity:0;animation:r-ring .6s cubic-bezier(.2,.7,.3,1) 1s both}
.fx-feather{position:absolute;left:240px;top:214px;width:17px;height:23px;margin:-11px 0 0 -8px;opacity:0;animation:fx-drift 1.2s cubic-bezier(.3,.2,.4,1) both}
.fx-petal{position:absolute;left:236px;top:314px;width:8px;height:12px;border-radius:50% / 60% 60% 40% 40%;opacity:0;animation:fx-petalfly .6s cubic-bezier(.2,.7,.3,1) 1s both}
@keyframes r-pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes r-hop{0%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.08,.9)}30%{transform:translateY(-56px) scale(.94,1.08)}45%{transform:translateY(-64px) scale(1,1)}62%{transform:translateY(0) scale(1.12,.88)}74%{transform:translateY(-6px) scale(.97,1.03)}86%,100%{transform:translateY(0) scale(1,1)}}
@keyframes r-flap{0%,14%{transform:rotate(0)}22%{transform:rotate(50deg)}30%{transform:rotate(-6deg)}38%{transform:rotate(50deg)}46%{transform:rotate(-6deg)}54%{transform:rotate(40deg)}62%{transform:rotate(0)}70%,86%{transform:rotate(72deg)}100%{transform:rotate(0)}}
@keyframes r-flap2{0%,14%{transform:rotate(0)}22%{transform:rotate(35deg)}30%{transform:rotate(0)}38%{transform:rotate(35deg)}46%{transform:rotate(0)}54%{transform:rotate(28deg)}62%{transform:rotate(0)}70%,86%{transform:rotate(55deg)}100%{transform:rotate(0)}}
@keyframes r-tail{0%,12%{transform:rotate(0)}30%{transform:rotate(-14deg)}62%{transform:rotate(10deg)}78%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
@keyframes r-head{0%{transform:rotate(0)}12%{transform:rotate(6deg)}30%,45%{transform:rotate(-10deg)}62%{transform:rotate(4deg)}80%,100%{transform:rotate(0)}}
@keyframes r-comb{0%,60%{transform:rotate(0)}68%{transform:rotate(-8deg)}78%{transform:rotate(6deg)}88%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@keyframes r-blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes r-shadow{0%,12%{transform:scaleX(1.1);opacity:.22}30%,45%{transform:scaleX(.6);opacity:.1}62%{transform:scaleX(1.15);opacity:.26}100%{transform:scaleX(1);opacity:.2}}
@keyframes r-ring{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.6)}}
@keyframes fx-drift{0%{opacity:0;transform:translate(calc(var(--dx) * .7),calc(var(--dy) * .25 - 14px)) rotate(0)}15%{opacity:.95}70%{opacity:.8}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--dr))}}
@keyframes fx-petalfly{0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1) rotate(160deg)}}
@media (prefers-reduced-motion: reduce){
.r-pop,.r-hop,.r-wing,.r-wing2,.r-tail,.r-head,.r-comb,.r-eye,.r-shadow{animation:none}
.r-ring,.fx-feather,.fx-petal{display:none}
}
