<title>Rooster · Milestone · crow</title>
<!--
  HIPHI rooster · Milestone · crow
  Use: The biggest personal moment, e.g. the end of the first visit (the Mahalo page).
  Trigger: When the Mahalo page (or another milestone page) arrives; the words sit under it.
  Plays: once · about 2600 ms
  Reduce Motion: Rooster stands still; beak closed; waves, feathers, ring and petals hidden.
  Design rules: Too long for a 1.5 s full-screen moment (A-10). Fits the Mahalo page pattern instead (a page that waits for Next, with its moment opening as it arrives, R-140/R-298).
  Self-contained: the inline SVG + this file's CSS are the whole animation. It plays once on load (loops loop).
  To replay, re-insert the element (or reload). See ../README.md for how to wire it in through pub/fx.js.
-->
<style>
body{margin:0}
a{color:#00698E}a:hover{color:#024F69}
.m-pop{transform-origin:50% 92%;animation:m-pop .34s cubic-bezier(.34,1.4,.64,1) both}
.m-body{transform-box:fill-box;transform-origin:50% 100%;animation:m-body 2.2s cubic-bezier(.2,.7,.3,1) .2s both}
.m-wing{transform-box:fill-box;transform-origin:85% 15%;animation:m-wing 2.2s linear .2s both}
.m-wing2{transform-box:fill-box;transform-origin:85% 15%;animation:m-wing2 2.2s linear .2s both}
.m-tail{transform-box:fill-box;transform-origin:100% 80%;animation:m-tail 2.2s cubic-bezier(.2,.7,.3,1) .2s both}
.m-head{transform-box:view-box;transform-origin:118px 100px;animation:m-head 2.2s cubic-bezier(.2,.7,.3,1) .2s both}
.m-comb{transform-box:fill-box;transform-origin:50% 115%;animation:m-comb 2.2s ease .2s both}
.m-closed{animation:m-hide 2.2s linear .2s both}
.m-open{opacity:0;animation:m-show 2.2s linear .2s both}
.m-wave{transform-box:fill-box;transform-origin:0% 50%;opacity:0}
.m-w1{animation:m-w1 2.2s ease-out .2s both}
.m-w2{animation:m-w2 2.2s ease-out .2s both}
.m-w3{animation:m-w3 2.2s ease-out .2s both}
.m-eye{transform-box:fill-box;transform-origin:center;animation:m-blink .22s ease 2.3s both}
.m-shadow{transform-origin:center;animation:m-shadow 2.2s cubic-bezier(.2,.7,.3,1) .2s both}
.m-ring{transform-origin:center;opacity:0;animation:m-ring .6s cubic-bezier(.2,.7,.3,1) 1.74s both}
.fx-feather{position:absolute;left:240px;top:200px;width:17px;height:23px;margin:-11px 0 0 -8px;opacity:0;animation:fx-drift 1.4s cubic-bezier(.3,.2,.4,1) both}
.fx-petal{position:absolute;left:236px;top:328px;width:9px;height:13px;border-radius:50% / 60% 60% 40% 40%;opacity:0;animation:fx-petalfly .7s cubic-bezier(.2,.7,.3,1) 1.72s both}
@keyframes m-pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes m-body{0%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.1,.86)}22%{transform:translateY(-60px) scale(.93,1.1)}32%{transform:translateY(-66px) scale(1,1)}45%{transform:translateY(-62px) scale(1.02,.99)}58%{transform:translateY(-66px) scale(1,1)}70%{transform:translateY(0) scale(1.14,.86)}80%{transform:translateY(-8px) scale(.97,1.03)}90%,100%{transform:translateY(0) scale(1,1)}}
@keyframes m-wing{0%,10%{transform:rotate(0)}14%{transform:rotate(50deg)}20%{transform:rotate(-6deg)}26%{transform:rotate(50deg)}34%{transform:rotate(66deg)}45%{transform:rotate(56deg)}56%{transform:rotate(66deg)}64%{transform:rotate(0)}72%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
@keyframes m-wing2{0%,10%{transform:rotate(0)}14%{transform:rotate(35deg)}20%{transform:rotate(0)}26%{transform:rotate(35deg)}34%{transform:rotate(50deg)}45%{transform:rotate(42deg)}56%{transform:rotate(50deg)}64%,100%{transform:rotate(0)}}
@keyframes m-tail{0%,10%{transform:rotate(0)}22%{transform:rotate(-10deg)}34%,56%{transform:rotate(-18deg)}70%{transform:rotate(10deg)}84%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
@keyframes m-head{0%{transform:rotate(0)}10%{transform:rotate(8deg)}22%{transform:rotate(-10deg)}32%{transform:rotate(-28deg)}40%{transform:rotate(-25deg)}48%{transform:rotate(-29deg)}56%{transform:rotate(-26deg)}66%{transform:rotate(4deg)}80%,100%{transform:rotate(0)}}
@keyframes m-comb{0%,66%{transform:rotate(0)}72%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@keyframes m-hide{0%,31%{opacity:1}32%,57%{opacity:0}58%,100%{opacity:1}}
@keyframes m-show{0%,31%{opacity:0}32%,57%{opacity:1}58%,100%{opacity:0}}
@keyframes m-w1{0%,33%{opacity:0;transform:scale(.5)}36%{opacity:1}46%{opacity:0;transform:scale(1.3)}100%{opacity:0}}
@keyframes m-w2{0%,39%{opacity:0;transform:scale(.5)}42%{opacity:1}52%{opacity:0;transform:scale(1.3)}100%{opacity:0}}
@keyframes m-w3{0%,45%{opacity:0;transform:scale(.5)}48%{opacity:1}58%{opacity:0;transform:scale(1.3)}100%{opacity:0}}
@keyframes m-blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes m-shadow{0%,10%{transform:scaleX(1.12);opacity:.24}22%,58%{transform:scaleX(.6);opacity:.1}70%{transform:scaleX(1.18);opacity:.28}100%{transform:scaleX(1);opacity:.2}}
@keyframes m-ring{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.8)}}
@keyframes fx-drift{0%{opacity:0;transform:translate(calc(var(--dx) * .7),calc(var(--dy) * .25 - 14px)) rotate(0)}15%{opacity:.95}70%{opacity:.8}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--dr))}}
@keyframes fx-petalfly{0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1) rotate(160deg)}}
@media (prefers-reduced-motion: reduce){
.m-pop,.m-body,.m-wing,.m-wing2,.m-tail,.m-head,.m-comb,.m-eye,.m-shadow{animation:none}
.m-closed{animation:none;opacity:1}
.m-open,.m-wave,.m-ring,.fx-feather,.fx-petal{display:none}
}
</style>
