<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIPHI Bill Tracker</title>
<script>
// GitHub Pages shows this for any address it does not have. A share link to a bill or issue whose page is not built yet
// (tools/share_pages.mjs runs hourly January to June, each morning otherwise; a stance taken this hour has none until the next run) still reaches the tracker
// (R-067). A bill page from an earlier session carries its year (b/2026/HB2121 -> #/bill/2026/HB2121, R-110). A page
// for one ask (R-169) opens that ask: b/HB2121-testify -> #/bill/HB2121/testify, as its built page would; following a
// bill whose page is not built yet opens the bill. Anything else goes to the tracker's front door.
(function () {
  var p = location.pathname, m = /\/(b|i)\/(?:(\d{4})\/)?([A-Za-z0-9-]+?)(?:\.html)?\/?$/.exec(p), base = p.replace(/\/(b|i)\/.*$/, '/').replace(/[^/]*$/, '');
  var ask = m && m[1] === 'b' ? /^([A-Za-z]+\d+)-(testify|ask|floor|conference|governor|follow)$/i.exec(m[3]) : null;
  var num = ask ? ask[1] : m && m[3], open = ask && ask[2].toLowerCase() !== 'follow' ? '/' + ask[2].toLowerCase() : '';
  var to = m ? base + 'track.html?via=share#/' + (m[1] === 'b' ? 'bill/' + (m[2] ? m[2] + '/' : '') + num.toUpperCase() + open : 'issue/' + m[3].toLowerCase()) : base + 'track.html';
  // A partner's word or a campaign's utm_ words on the link go on in place of ?via=share (R-113, W1).
  try { var q = new URLSearchParams(location.search), u = new URL(to, location.href);
    if (/^[a-z0-9-]{2,40}$/i.test(q.get('via') || '')) u.searchParams.set('via', q.get('via'));
    ['utm_source', 'utm_medium', 'utm_campaign'].forEach(function (k) { if (q.get(k)) u.searchParams.set(k, q.get(k).slice(0, 60)); });
    to = u.href; } catch (e) { /* the plain address */ }
  location.replace(to);
})();
</script></head><body style="font-family:system-ui,sans-serif;padding:24px"><p><a href="track.html">Go to HIPHI’s Bill Tracker</a></p></body></html>
