<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIPHI Bill Tracker</title>
<!-- Version A used to be its own page (R-071). Since R-187 (Nate 10/6) it is the live A/B test 'layout' on track.html, so
     this address opens the practice copy there on version A, keeping the rest of the link (the day, other versions, the
     page after the #). -->
<script>
var q = new URLSearchParams(location.search);
q.set('demo', '1');
q.set('ab', (q.get('ab') || '').split(',').filter(function (x) { return x && x.indexOf('layout.') !== 0; }).concat('layout.a').join(','));
location.replace('track.html?' + q.toString() + location.hash);
</script>
</head>
<body><p><a href="track.html?demo=1&amp;ab=layout.a">Open the tracker</a></p></body>
</html>
