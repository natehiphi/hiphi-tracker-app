<!-- Drawn by the page itself, before any script arrives: on a slow Capitol connection the 30-odd module files take
     seconds, and an empty page reads as broken. If the code never arrives, this becomes "Try again". -->
<style>
.boot0 { min-height: 100vh; display: flex; flex-direction: column; background: #F2F6F9; font-family: Lato, system-ui, sans-serif; color: #33464F; }
.boot0 .bar { height: 56px; background: #fff; border-bottom: 1px solid #DDE5EA; display: flex; align-items: center; padding: 0 16px; font: 700 18px/1 Roboto, system-ui, sans-serif; color: #0F2A36; }
.boot0 .msg { padding: 32px 16px; max-width: 720px; margin: 0 auto; width: 100%; box-sizing: border-box; }
.boot0 h1 { font: 700 22px/1.25 Roboto, system-ui, sans-serif; color: #0F2A36; margin: 0 0 8px; }
.boot0 p { margin: 0 0 16px; font-size: 16px; }
.boot0 button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #00698E; color: #fff; font: 700 16px Lato, system-ui, sans-serif; cursor: pointer; }
</style>
<div id="app"><div class="boot0" role="status"><div class="bar">Bill Tracker</div><div class="msg"><p>Loading the tracker…</p></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
function bootFail() { var a = document.getElementById('app'); if (!a || !a.querySelector('.boot0 [role], .boot0')) return; if (a.querySelector('.boot0')) a.innerHTML = '<div class="boot0"><div class="bar">Bill Tracker</div><main class="msg"><h1>We could not load the tracker</h1><p>Check your connection and try again.</p><button type="button" onclick="location.reload()">Try again</button></main></div>'; }
window.__bootT = setTimeout(bootFail, 20000);
</script>
<script type="module" src="staff5/app.js" onerror="bootFail()"></script>
